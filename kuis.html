<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2428">
<meta name="robots" content="noindex">
<title>Ujian Meta Ads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>:root{
  /* Arah: ruang ujian versi game. Rangka gelap teal (keluarga Sales Quest), soal dicetak di "kertas LJK":
     tinta merah-magenta khas lembar jawaban komputer, bulatan yang dihitamkan pakai grafit. */
  --ink:#0E2428; --surface:#15353B; --raised:#1F474E; --line:#2D5C63;
  --paper:#F4EEDF; --muted:#A6C0BB;
  --coral:#FF6A3D; --coral-d:#B63F1A; --sun:#FFC23D; --sun-d:#B5830C; --mint:#4FE0A6; --mint-d:#1E976A;
  --kertas:#FBFAF5; --kertas-2:#F1EFE6; --tinta:#CF2F69; --tinta-d:#9E1E4C; --tinta-muda:rgba(207,47,105,.11);
  --grafit:#26282D; --teks:#1E2125; --abu:#6A6E75;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif;
  --safe-top:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  --safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.ujian{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
svg{flex:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#root{height:100%}
.layar{position:relative;height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.gulir{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 16px 28px}
.isi{display:flex;flex-direction:column;gap:16px}
.atas{padding:calc(var(--safe-top) + 12px) 16px 8px}
.bawah{padding:10px 16px calc(12px + var(--safe-bot));background:linear-gradient(to bottom,rgba(14,36,40,0),var(--ink) 30%)}

h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.08;text-wrap:balance}
h1{font-size:30px}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.redup{color:var(--muted)}
.kecil{font-size:13px}
.angka{font-variant-numeric:tabular-nums}

/* ---------- Tombol ---------- */
.btn{--sh:#BDB4A1;appearance:none;border:0;margin:0;font:inherit;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em;color:var(--ink);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--sh);cursor:pointer;text-align:center;text-decoration:none;transition:transform .08s ease,box-shadow .08s ease,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn svg{width:21px;height:21px}
.btn-coral{--sh:var(--coral-d);background:var(--coral)}
.btn-mint{--sh:var(--mint-d);background:var(--mint)}
.btn-sun{--sh:var(--sun-d);background:var(--sun)}
.btn-tinta{--sh:var(--tinta-d);background:var(--tinta);color:#fff}
.btn-ghost{--sh:transparent;background:transparent;color:var(--paper);border:2px solid var(--line);font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0}
.btn-ghost:active{transform:translateY(2px)}
.btn-bahaya{--sh:transparent;background:transparent;color:#FF9B7A;border:2px solid #7A2410;font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0}
.btn-xl{width:100%;min-height:60px;font-size:18px}
.btn-kecil{min-height:40px;padding:8px 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--sh)}
.btn-ghost.btn-kecil,.btn-bahaya.btn-kecil{font-size:13.5px}
.btn[disabled]{filter:saturate(.3) brightness(.75);cursor:default;pointer-events:none}
.btn.memuat{pointer-events:none}
.btn.memuat::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:putar .7s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.baris-btn{display:flex;gap:10px}
.baris-btn>.btn{flex:1}
.link-btn svg{width:16px;height:16px;vertical-align:-3px}
.link-btn{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:10px;align-self:center;cursor:pointer}
.ikon-btn{appearance:none;flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--raised);background:var(--surface);color:var(--paper);display:grid;place-items:center;cursor:pointer;position:relative}
.ikon-btn svg{width:20px;height:20px}

/* ---------- Kartu & isian (rangka gelap) ---------- */
.kartu{background:var(--surface);border:2px solid var(--raised);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:7px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend,.label{font-size:13px;font-weight:600;color:var(--muted)}
.field>legend{padding:0;margin-bottom:7px}
.field small{font-weight:500;opacity:.85}
.inp{font:inherit;font-size:16px;color:var(--paper);background:var(--surface);border:2px solid var(--raised);border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
.inp::placeholder{color:#6F8D89}
.inp:focus{border-color:var(--sun)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.err{margin:0;font-size:13.5px;color:#FF9B7A;font-weight:600}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.p-belum{background:var(--raised);color:var(--muted)}
.p-jalan{background:rgba(134,204,255,.18);color:#9ED6FF}
.p-nilai{background:var(--sun);color:var(--ink)}
.p-lulus{background:var(--mint);color:var(--ink)}
.p-gagal{background:rgba(255,106,61,.2);color:#FF9B7A}
.catatan{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding:10px 12px;border:1.5px dashed var(--line);border-radius:14px}
.catatan svg{width:18px;height:18px;margin-top:1px;color:var(--sun)}
.kosong{color:var(--muted);font-size:14px;padding:18px 14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.kerangka{height:72px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0,var(--raised) 50%,var(--surface) 100%);background-size:200% 100%;animation:kilau 1.3s linear infinite}
@keyframes kilau{to{background-position:-200% 0}}
.saklar{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.saklar span{display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:15px}
.saklar small{font-weight:400;font-size:13px;color:var(--muted)}
.saklar input{appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--raised);border:2px solid var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.saklar input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.saklar input:checked{background:var(--mint-d);border-color:var(--mint)}
.saklar input:checked::after{transform:translateX(20px);background:var(--paper)}
.segmen{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--ink);border:2px solid var(--raised);border-radius:16px}
.segmen label{position:relative}
.segmen input{position:absolute;opacity:0;width:1px;height:1px}
.segmen span{display:flex;align-items:center;justify-content:center;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;line-height:1.2;min-height:40px}
.segmen input:checked+span{background:var(--paper);color:var(--ink)}
.segmen input:focus-visible+span{outline:3px solid var(--sun)}

/* ---------- Kertas LJK ---------- */
.kertas{--wm:none;position:relative;background:var(--kertas);color:var(--teks);border-radius:6px 6px 18px 18px;padding:22px 18px 22px 30px;box-shadow:0 10px 0 rgba(0,0,0,.28);isolation:isolate}
/* jalur tanda waktu OMR di tepi kiri */
.kertas::before{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:7px;background:repeating-linear-gradient(to bottom,var(--grafit) 0 5px,transparent 5px 22px);opacity:.78;border-radius:1px}
/* tanda air nama + kode peserta */
.kertas::after{content:"";position:absolute;inset:0;background-image:var(--wm);background-size:230px 150px;opacity:.07;pointer-events:none;z-index:-1;border-radius:inherit}
.kertas-kepala{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:16px;border-bottom:1.5px solid var(--tinta)}
.nomor{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--tinta);color:var(--tinta);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.kepala-teks{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.kepala-teks b{font-size:14px;font-weight:700;color:var(--tinta)}
.kepala-teks span{font-size:12.5px;color:var(--abu)}
.poin-tag{flex:none;font-size:12px;font-weight:700;color:var(--tinta);border:1.5px solid var(--tinta);border-radius:8px;padding:3px 7px;white-space:nowrap}
.konteks{font-family:var(--serif);font-size:16px;line-height:1.6;margin:0 0 14px;padding:2px 0 2px 12px;border-left:3px solid var(--tinta-muda);color:#33373C}
.tanya{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.5;margin:0 0 16px;color:var(--teks)}
.petunjuk-soal{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--tinta);margin:-6px 0 12px}
.petunjuk-soal svg{width:16px;height:16px}
.tabel-wrap{overflow-x:auto;margin:0 -4px 16px;padding:0 4px;-webkit-overflow-scrolling:touch}
.tabel{border-collapse:collapse;width:100%;min-width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tabel th{background:var(--tinta);color:#fff;font-weight:600;text-align:left;padding:7px 9px;white-space:nowrap;font-size:12.5px}
.tabel th:first-child{border-radius:6px 0 0 0}.tabel th:last-child{border-radius:0 6px 0 0}
.tabel td{padding:8px 9px;border-bottom:1px solid #E3DFD3;white-space:nowrap}
.tabel tr:nth-child(even) td{background:var(--kertas-2)}

.opsi-list{display:flex;flex-direction:column;gap:9px}
.opsi{appearance:none;width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;text-align:left;font:inherit;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--teks);background:#fff;border:1.5px solid #DAD5C8;border-radius:14px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.opsi:active{background:var(--kertas-2)}
.bulat{position:relative;width:34px;height:34px;border-radius:50%;border:1.8px solid var(--tinta);color:var(--tinta);display:grid;place-items:center;font-family:var(--body);font-weight:700;font-size:15px;margin-top:-3px;overflow:hidden}
.opsi[role="checkbox"] .bulat{border-radius:9px}
/* arsiran pensil 2B */
.bulat::before{content:"";position:absolute;inset:-2px;border-radius:inherit;background:radial-gradient(circle at 35% 30%,#4A4D54,var(--grafit) 70%);clip-path:circle(0% at 50% 50%);transition:clip-path .22s cubic-bezier(.3,.8,.3,1)}
.bulat i{position:relative;font-style:normal}
.opsi[aria-checked="true"]{border-color:var(--grafit);background:#fff;box-shadow:inset 0 0 0 1px var(--grafit)}
.opsi[aria-checked="true"] .bulat{border-color:var(--grafit);color:var(--kertas)}
.opsi[aria-checked="true"] .bulat::before{clip-path:circle(75% at 50% 50%)}
.opsi:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}

.esai-wrap{display:flex;flex-direction:column;gap:8px}
.esai{font:inherit;font-family:var(--serif);font-size:16.5px;line-height:30px;color:var(--teks);width:100%;min-height:300px;resize:vertical;border:1.5px solid #DAD5C8;border-radius:12px;padding:6px 14px;background:#fff repeating-linear-gradient(to bottom,transparent 0 29px,var(--tinta-muda) 29px 30px);background-attachment:local;outline:none}
.esai:focus{border-color:var(--tinta)}
.esai-info{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--abu)}

/* ---------- Gerbang: masukin kode ---------- */
.gerbang{justify-content:center;min-height:100%;padding-top:18px}
.judul-besar{display:flex;flex-direction:column;gap:8px}
.judul-besar h1{font-size:clamp(38px,11vw,54px);line-height:.98;letter-spacing:.01em}
.judul-besar h1 span{display:block;color:var(--sun)}
.judul-besar p{font-size:15px;color:var(--muted)}
.slip{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.slip-judul{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slip-judul b{font-size:14px;color:var(--tinta);font-weight:700}
.slip-judul span{font-size:12px;color:var(--abu)}
.kotak-kode{position:relative;display:grid;grid-template-columns:repeat(3,1fr) 14px repeat(3,1fr);gap:6px;align-items:center}
.kotak-kode .sel{height:62px;border:2px solid var(--tinta);border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--grafit);background:#fff;transition:border-color .15s,box-shadow .15s}
.kotak-kode .sel.aktif{box-shadow:0 0 0 3px var(--tinta-muda);border-color:var(--tinta-d)}
.kotak-kode .sel.aktif:empty::after{content:"";width:2px;height:28px;background:var(--tinta);animation:kedip 1s steps(1) infinite}
@keyframes kedip{50%{opacity:0}}
.kotak-kode .strip{height:2px;background:var(--tinta);border-radius:1px}
.kotak-kode input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;letter-spacing:40px;caret-color:transparent;border:0;background:transparent;color:transparent}
.slip .err{color:var(--tinta-d)}
.slip .btn{margin-top:4px}
.bawah-gerbang{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:13px;color:var(--muted)}

/* ---------- Briefing ---------- */
.halo{display:flex;flex-direction:column;gap:6px}
.halo p{color:var(--muted);font-size:14.5px}
.ringkas-ujian{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ringkas-ujian div{background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ringkas-ujian b{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.05}
.ringkas-ujian span{font-size:12.5px;color:var(--muted);font-weight:600}
.jenis-list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.jenis-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #E3DFD3;font-size:15px}
.jenis-list li:last-child{border-bottom:0}
.jl-teks{display:flex;flex-direction:column;gap:1px;min-width:0}
.jl-teks b{font-weight:600;font-size:15px;color:var(--teks)}
.jl-teks small{font-size:13px;color:var(--abu)}
.jl-n{margin-left:auto;font-family:var(--display);font-weight:400;font-size:18px;color:var(--tinta)}
.aturan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;font-family:var(--serif);font-size:15.5px;line-height:1.5}
.aturan li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.aturan svg{width:20px;height:20px;color:var(--tinta);margin-top:2px}
.siap{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;padding:2px 0}
.siap input{appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);margin:0;display:grid;place-items:center;cursor:pointer}
.siap input:checked{background:var(--mint);border-color:var(--mint)}
.siap input:checked::after{content:"";width:7px;height:13px;border:solid var(--ink);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}

/* ---------- Hitung mundur ---------- */
.hitung{position:fixed;inset:0;z-index:50;background:var(--ink);display:grid;place-items:center}
.hitung b{font-family:var(--display);font-weight:400;font-size:min(46vw,220px);color:var(--sun);line-height:1}
.hitung b.go{font-size:min(20vw,96px);color:var(--mint)}

/* ---------- Layar ujian ---------- */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.timer{position:relative;width:76px;height:76px;flex:none}
.timer svg{width:76px;height:76px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.timer .jalur{stroke:var(--raised)}
.timer .isi-ring{stroke:var(--mint);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.timer.awas .isi-ring{stroke:var(--sun)}
.timer.awas b{color:var(--sun)}
.timer.kritis .isi-ring{stroke:var(--coral)}
.timer.kritis b{color:var(--coral);animation:denyut 1s ease-in-out infinite}
@keyframes denyut{50%{transform:scale(1.12)}}
.posisi{min-width:0;display:flex;flex-direction:column;gap:7px}
.posisi-teks{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.posisi-teks b{font-family:var(--display);font-weight:400;font-size:17px}
.posisi-teks span{font-size:12px;color:var(--muted);white-space:nowrap}
.posisi-teks span.gagal{color:#FF9B7A}
.posisi-teks span.ok{color:var(--mint)}
.jejak{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.jejak i{height:8px;border-radius:3px;background:var(--raised)}
.jejak i.isi{background:var(--mint)}
.jejak i.ragu{background:var(--sun)}
.jejak i.kini{box-shadow:0 0 0 2px var(--paper)}
.ikon-btn .titik{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink)}
.layar-ujian .gulir{padding-top:4px}
.kertas-anim{animation:lembar .38s cubic-bezier(.2,.9,.3,1) both}
@keyframes lembar{from{transform:translateY(26px) rotate(.6deg);opacity:0}}
.kertas-anim.mundur{animation-name:lembar-balik}
@keyframes lembar-balik{from{transform:translateY(-14px) rotate(-.5deg);opacity:0}}
.nav-ujian{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center}
.nav-ujian .btn{min-height:54px;padding:10px}
.btn-ragu{--sh:transparent;background:transparent;color:var(--paper);border:2px solid var(--line);font-family:var(--body);font-weight:600;font-size:14.5px;letter-spacing:0}
.btn-ragu[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun);--sh:var(--sun-d)}
.peringatan{position:fixed;left:50%;top:calc(var(--safe-top) + 14px);z-index:45;transform:translate(-50%,-140%);width:calc(100% - 28px);max-width:520px;background:var(--coral);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 var(--coral-d);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);font-size:14px;font-weight:600}
.peringatan.show{transform:translate(-50%,0)}
.peringatan svg{width:24px;height:24px}
.peringatan b{display:block;font-family:var(--display);font-weight:400;font-size:15px}

/* Lembar jawaban (peta soal) */
.ljk{background:var(--kertas);color:var(--teks);border-radius:14px;padding:12px 10px 12px 26px;position:relative}
.ljk::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:6px;background:repeating-linear-gradient(to bottom,var(--grafit) 0 4px,transparent 4px 15px);opacity:.7}
.ljk-baris{appearance:none;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 4px;border:0;border-bottom:1px solid #E7E3D8;background:none;font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:8px}
.ljk-baris:last-child{border-bottom:0}
.ljk-baris.kini{background:var(--tinta-muda)}
.ljk-no{font-family:var(--display);font-size:14px;color:var(--tinta);text-align:right}
.ljk-bulat{display:flex;gap:5px;flex-wrap:wrap}
.ljk-bulat i{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--tinta);color:var(--tinta);font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.ljk-bulat.kotak i{border-radius:6px}
.ljk-bulat i.isi{background:var(--grafit);border-color:var(--grafit);color:var(--kertas)}
.ljk-esai{font-size:12.5px;font-weight:600;color:var(--abu);display:flex;align-items:center;gap:6px}
.ljk-esai.isi{color:var(--grafit)}
.ljk-esai svg{width:15px;height:15px}
.bendera{width:20px;height:20px;color:transparent}
.bendera.on{color:var(--sun-d)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:3px;background:var(--raised)}
.legenda i.isi{background:var(--mint)}.legenda i.ragu{background:var(--sun)}

/* ---------- Kirim & hasil ---------- */
.ringkas-kirim{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringkas-kirim div{background:var(--surface);border:2px solid var(--raised);border-radius:14px;padding:10px;text-align:center}
.ringkas-kirim b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.ringkas-kirim span{font-size:12px;color:var(--muted);font-weight:600}
.ringkas-kirim .warn b{color:var(--sun)}
.ringkas-kirim .bahaya b{color:#FF9B7A}
.daftar-no{display:flex;flex-wrap:wrap;gap:8px}
.daftar-no button{appearance:none;min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--paper);font-family:var(--display);font-size:15px;cursor:pointer}
.daftar-no button.ragu{border-color:var(--sun);color:var(--sun)}
.hasil{align-items:stretch;text-align:center;padding-top:10px}
.skor-besar{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:26px 16px 22px}
.skor-besar small{font-size:13px;color:var(--abu);font-weight:600}
.skor-besar b{font-family:var(--display);font-weight:400;font-size:84px;line-height:1;color:var(--grafit);font-variant-numeric:tabular-nums}
.skor-besar em{font-style:normal;font-size:14px;color:var(--abu)}
.stempel{display:inline-block;margin-top:14px;font-family:var(--display);font-size:24px;padding:6px 16px;border:3.5px solid currentColor;border-radius:10px;transform:rotate(-7deg);letter-spacing:.04em;opacity:.92}
.stempel.lulus{color:#16855C}
.stempel.gagal{color:var(--tinta)}
.stempel.tunggu{color:var(--sun-d);font-size:17px}
.stempel-anim{animation:cap .45s cubic-bezier(.2,1.4,.4,1) .35s both}
@keyframes cap{from{transform:rotate(-7deg) scale(2.4);opacity:0}}
.rincian{display:grid;grid-template-columns:1fr 1fr;gap:0;text-align:left;border-top:1.5px solid var(--tinta);margin-top:6px}
.rincian div{padding:11px 4px;border-bottom:1px solid #E3DFD3;display:flex;flex-direction:column;gap:1px}
.rincian div:nth-child(odd){padding-right:10px}
.rincian span{font-size:12.5px;color:var(--abu)}
.rincian b{font-size:16px;font-weight:700;color:var(--teks)}
.kirim-ikon{width:84px;height:84px;margin:6px auto 0;border-radius:26px;background:var(--mint);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 0 var(--mint-d)}
.kirim-ikon svg{width:44px;height:44px}

/* ---------- Layar penuh: sinyal & sesi ---------- */
.tengah{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:100%;padding:24px}
.tengah p{max-width:34ch;color:var(--muted)}
.ikon-besar{width:76px;height:76px;border-radius:24px;background:var(--raised);color:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #0A1A1D;margin-bottom:4px}
.ikon-besar svg{width:38px;height:38px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--raised);border-top-color:var(--sun);animation:putar .8s linear infinite}

/* ---------- Sheet & toast ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,16,18,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-panel{width:100%;max-width:560px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);border:2px solid var(--raised);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + var(--safe-bot));display:flex;flex-direction:column;gap:16px;animation:naik .32s cubic-bezier(.2,.9,.3,1) both}
.sheet-panel.full{min-height:100%;border-radius:0;border:0;padding-top:calc(var(--safe-top) + 14px)}
@keyframes naik{from{transform:translateY(40px);opacity:.3}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{font-size:21px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));z-index:55;transform:translate(-50%,16px);opacity:0;background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= ADMIN ================= */
.kepala-admin{display:flex;align-items:center;gap:12px}
.kepala-admin .judul{flex:1;min-width:0}
.kepala-admin h1{font-size:23px}
.kepala-admin p{font-size:13px;color:var(--muted)}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--paper);box-shadow:inset 0 0 0 2px var(--raised)}
.tab .titik{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;padding:0 4px;background:var(--sun);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.stat.mint b{color:var(--mint)}.stat.sun b{color:var(--sun)}
.status-ujian{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.status-ujian i{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(79,224,166,.18)}
.status-ujian.tutup i{background:var(--coral);box-shadow:0 0 0 4px rgba(255,106,61,.18)}
.status-ujian .link-btn{margin-left:auto;padding:4px}
.filter{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{appearance:none;flex:none;border:2px solid var(--raised);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.filter button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.filter button em{font-style:normal;font-weight:800;margin-left:4px;opacity:.75}
.cari{position:relative}
.cari svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.cari .inp{padding-left:40px}
.daftar{display:flex;flex-direction:column;gap:8px}
.orang{appearance:none;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px;color:inherit;font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 0 #0A1A1D;transition:transform .08s,box-shadow .08s}
.orang:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1A1D}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--ink)}
.orang-nama{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.orang-sub{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.kode-chip{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--paper);background:var(--raised);padding:2px 7px;border-radius:7px}
.waspada{color:#FF9B7A;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.waspada svg{width:14px;height:14px}
.orang-kanan{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.orang-kanan b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.mini-bar{width:100%;height:6px;border-radius:3px;background:var(--ink);overflow:hidden;margin-top:6px;grid-column:2/4}
.mini-bar i{display:block;height:100%;background:#86CCFF;border-radius:3px}
.kode-baru{display:flex;flex-direction:column;gap:8px}
.kode-baris{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);border:2px solid var(--raised);border-radius:14px}
.kode-baris b{display:block;font-size:14.5px}
.kode-baris span{font-family:var(--display);font-size:19px;letter-spacing:.06em;color:var(--sun)}

/* panel admin versi simpel */
.stat-grid.tiga{grid-template-columns:repeat(3,1fr)}
.tutup-kartu{border-color:#7A2410;flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.tutup-kartu p{font-size:14px;color:var(--muted)}
.tutup-kartu b{color:#FF9B7A}
.fakta{display:flex;flex-direction:column}
.fakta div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--raised);font-size:14px}
.fakta div:last-child{border-bottom:0}
.fakta span{color:var(--muted)}
.fakta b{text-align:right;font-weight:600}
.fakta .merah b{color:#FF9B7A}
.draf-ai{border-color:var(--sun-d)}
.langkah{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
.soal-baris .btn-kecil{min-height:38px}
details.kartu.lipat>summary{font-weight:700;font-size:15px}
.soal-analisis.lipat summary{align-items:flex-start}
.soal-analisis.lipat summary::after{margin-top:6px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

/* top up */
.va-kotak{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);color:var(--paper);font:inherit;text-align:left;cursor:pointer}
.va-kotak span{display:flex;flex-direction:column;gap:2px}
.va-kotak small{font-size:11.5px;color:var(--muted);font-weight:600}
.va-kotak b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.va-kotak svg{width:20px;height:20px;color:var(--muted)}
.tp{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.tp svg{width:14px;height:14px}
.tp-kirim{color:var(--sun)}.tp-selesai{color:var(--mint)}.tp-tolak{color:#FF9B7A}

/* pendaftar baru (dari bot) */
.daftar-baru{border-color:var(--sun-d)}
.kepala-daftar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pendaftar{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--ink);border-radius:14px}
.pendaftar-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.pendaftar-info b{font-size:15.5px}
.pendaftar-info>span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.cepat-alasan{display:flex;flex-wrap:wrap;gap:6px}
.cepat-alasan button{appearance:none;border:2px solid var(--raised);background:var(--surface);color:var(--paper);font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;cursor:pointer}

/* detail peserta */
.balik{display:flex;align-items:center;gap:12px}
.balik h1{font-size:21px;flex:1;min-width:0;overflow-wrap:anywhere}
.skor-kartu{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.cincin{position:relative;width:96px;height:96px}
.cincin svg{width:96px;height:96px;transform:rotate(-90deg)}
.cincin circle{fill:none;stroke-width:9}
.cincin b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:24px}
.skor-rinci{display:flex;flex-direction:column;gap:6px;font-size:14px}
.skor-rinci div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--raised);padding-bottom:5px}
.skor-rinci div:last-child{border-bottom:0}
.skor-rinci b{font-variant-numeric:tabular-nums}
.awas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.awas-grid div{background:var(--ink);border-radius:12px;padding:9px 10px}
.awas-grid b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.awas-grid span{font-size:11.5px;color:var(--muted);font-weight:600}
.awas-grid .merah b{color:#FF9B7A}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;font-size:13.5px}
.log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--raised)}
.log li:last-child{border-bottom:0}
.log time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.log .merah{color:#FF9B7A}
details.lipat summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.lipat summary::-webkit-details-marker{display:none}
details.lipat summary::after{content:"";width:9px;height:9px;border:solid currentColor;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}
details.lipat[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.aksi-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* kartu jawaban (kertas) di admin */
.kertas.kecil{padding:16px 14px 16px 26px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.kertas.kecil::before{left:8px;width:6px}
.kertas.kecil .kertas-kepala{padding-bottom:10px;margin-bottom:12px}
.kertas.kecil .nomor{width:36px;height:36px;font-size:15px}
.kertas.kecil .tanya{font-size:16px;margin-bottom:12px}
.kertas.kecil .konteks{font-size:14.5px}
.hasil-tag{flex:none;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.h-benar{background:#D4F6E7;color:#0E6B47}
.h-sebagian{background:#FFEFC2;color:#7A5500}
.h-salah{background:#FBD9E5;color:var(--tinta-d)}
.h-kosong{background:#E9E6DD;color:var(--abu)}
.h-menunggu{background:var(--sun);color:var(--ink)}
.h-dinilai{background:#D4F6E7;color:#0E6B47}
.opsi-baca{display:grid;grid-template-columns:30px minmax(0,1fr) 20px;gap:10px;align-items:start;padding:9px 10px;border-radius:12px;border:1.5px solid #E3DFD3;background:#fff;font-family:var(--serif);font-size:15px;line-height:1.45}
.opsi-baca .bulat{width:30px;height:30px;font-size:13px;margin-top:-3px}
.opsi-baca.dipilih .bulat{border-color:var(--grafit);color:var(--kertas)}
.opsi-baca.dipilih .bulat::before{clip-path:circle(75% at 50% 50%)}
.opsi-baca.kunci{border-color:#36B587;background:#F1FBF6}
.opsi-baca.salah{border-color:var(--tinta);background:#FDF2F6}
.opsi-baca svg{width:20px;height:20px;margin-top:2px}
.opsi-baca.kunci svg{color:#16855C}
.opsi-baca.salah svg{color:var(--tinta)}
.opsi-baca-list{display:flex;flex-direction:column;gap:7px}
.pembahasan{margin-top:12px;font-size:14px;font-family:var(--serif);line-height:1.55;color:#3A3E44}
.pembahasan summary{font-family:var(--body);font-weight:600;font-size:13.5px;color:var(--tinta);cursor:pointer}
.pembahasan p{margin-top:8px}
.jawab-esai{font-family:var(--serif);font-size:15.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1.5px solid #E3DFD3;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.jawab-esai.kosong-esai{color:var(--abu);font-style:italic}
.rubrik{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.rubrik li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.rubrik li::before{content:"";width:10px;height:10px;margin-top:5px;border:1.8px solid var(--tinta);border-radius:3px}
.penilai{display:flex;flex-direction:column;gap:10px;background:var(--kertas-2);border-radius:14px;padding:12px}
.penilai-skor{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:10px;align-items:center}
.penilai-skor button{appearance:none;height:48px;border-radius:14px;border:2px solid var(--grafit);background:#fff;color:var(--grafit);font-size:24px;font-weight:700;cursor:pointer;line-height:1}
.penilai-skor output{text-align:center;font-family:var(--display);font-size:30px;color:var(--grafit);line-height:1}
.penilai-skor output small{font-family:var(--body);font-size:14px;color:var(--abu);font-weight:600}
.cepat{display:flex;gap:6px}
.cepat button{appearance:none;flex:1;border:1.5px solid #CFCABD;background:#fff;color:var(--teks);border-radius:10px;padding:7px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.penilai .inp{background:#fff;color:var(--teks);border-color:#CFCABD;font-size:15px}
.penilai .inp:focus{border-color:var(--tinta)}

/* analisis */
.bar-topik{display:flex;flex-direction:column;gap:12px}
.bar-baris{display:flex;flex-direction:column;gap:5px}
.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.bar-label b{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--mint)}
.bar i.sedang{background:var(--sun)}
.bar i.lemah{background:var(--coral)}
.distribusi{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.dist{display:grid;grid-template-columns:22px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.dist .huruf{font-weight:800;color:var(--muted)}
.dist.kunci .huruf{color:var(--mint)}
.dist .bar{height:20px;border-radius:6px;position:relative}
.dist .bar i{background:var(--line)}
.dist.kunci .bar i{background:var(--mint-d)}
.dist .bar span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;right:8px;color:var(--paper)}
.dist b{text-align:right;font-variant-numeric:tabular-nums}

/* ================= TELEGRAM ================= */
const versi = v => { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } };
function siapkanTelegram() {
  if (!tg) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  if (!inTG) return;
  try { if (versi('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  try { if (versi('6.1')) { tg.setHeaderColor('#0E2428'); tg.setBackgroundColor('#0E2428'); } } catch (e) {}
  try { if (versi('7.10')) tg.setBottomBarColor('#0E2428'); } catch (e) {}
  try { if (versi('6.1')) tg.BackButton.onClick(aksiBalik); } catch (e) {}
}
function layarPenuh(on) {
  if (!inTG) return;
  try { if (on && versi('8.0') && ['android', 'ios'].includes(tg.platform) && !tg.isFullscreen) tg.requestFullscreen(); } catch (e) {}
  try { if (versi('6.2')) on ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const getar = {
  ketuk() { try { inTG ? tg.HapticFeedback.impactOccurred('light') : vib(8); } catch (e) {} },
  pilih() { try { inTG ? tg.HapticFeedback.selectionChanged() : vib(6); } catch (e) {} },
  sukses() { try { inTG ? tg.HapticFeedback.notificationOccurred('success') : vib([12, 60, 18]); } catch (e) {} },
  awas() { try { inTG ? tg.HapticFeedback.notificationOccurred('warning') : vib([30, 40, 30]); } catch (e) {} },
  gagal() { try { inTG ? tg.HapticFeedback.notificationOccurred('error') : vib([40, 30, 40]); } catch (e) {} },
};
function pastikanIzinTulis() {
  return new Promise(resolve => {
    try {
      const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!inTG || (u && u.allows_write_to_pm) || !versi('6.9')) return resolve(true);
      tg.requestWriteAccess(ok => resolve(!!ok));
    } catch (e) { resolve(true); }
  });
}

/* ================= SERVER ================= */
class GagalApi extends Error { constructor(pesan, status, kode) { super(pesan); this.status = status; this.kode = kode; } }
async function api(rute, data = {}, timeout = 20000) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const tm = ctrl ? setTimeout(() => ctrl.abort(), timeout) : null;
  let res;
  try {
    res = await fetch(`${API_URL}/api/${rute}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': (tg && tg.initData) || '' },
      body: JSON.stringify(data), signal: ctrl ? ctrl.signal : undefined,
    });
  } catch (e) {
    throw new GagalApi('Server nggak bisa dihubungi. Cek sinyal kamu. Kalau pakai Wi-Fi, coba ganti ke data seluler.', 0, 'JARINGAN');
  } finally { if (tm) clearTimeout(tm); }
  let j = {};
  try { j = await res.json(); } catch (e) {}
  if (!res.ok || !j.ok) throw new GagalApi(j.error || `Server error (${res.status})`, res.status, j.kode);
  if (j.sekarang) OFFSET = j.sekarang - Date.now();
  return j;
}
function beacon(rute, data) {
  try { if (navigator.sendBeacon) return navigator.sendBeacon(`${API_URL}/api/${rute}`, new Blob([JSON.stringify(data)], { type: 'text/plain' })); } catch (e) {}
  return false;
}
const pesanError = e => (e && e.message) || 'Ada yang salah. Coba lagi ya.';
async function tombolProses(btn, fn) {
  if (btn) { btn.classList.add('memuat'); btn.disabled = true; }
  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.classList.remove('memuat'); btn.disabled = false; } }
}

/* ================= EFEK & SHEET ================= */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
function confetti(power = 1) {
  if (reduced) return;
  const c = $('#confetti'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const warna = ['#CF2F69', '#FFC23D', '#4FE0A6', '#F4EEDF', '#86CCFF'];
  const P = Array.from({ length: Math.round(120 * power) }, () => ({ x: w / 2 + (Math.random() - .5) * 90, y: h * .38, vx: (Math.random() - .5) * 13, vy: -Math.random() * 14 - 6, s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: warna[Math.random() * warna.length | 0], kotak: Math.random() < .55 }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, w, h);
    P.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; if (p.kotak) g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); else { g.beginPath(); g.arc(0, 0, p.s / 3, 0, 7); g.fill(); } g.restore(); });
    if (t - t0 < 2300) requestAnimationFrame(frame); else g.clearRect(0, 0, w, h);
  })(t0);
}
let sheetSaatTutup = null, sheetKunci = false;
function bukaSheet(html, opsi = {}) {
  const s = $('#sheet');
  s.innerHTML = `<div class="sheet-panel ${opsi.full ? 'full' : ''}" role="document">${html}</div>`;
  s.hidden = false; sheetSaatTutup = opsi.saatTutup || null; sheetKunci = !!opsi.kunci;
  perbaruiBalik();
  const fokus = $('[autofocus]', s) || $('h2', s);
  if (fokus) { if (fokus.tagName === 'H2') fokus.setAttribute('tabindex', '-1'); setTimeout(() => fokus.focus({ preventScroll: true }), 60); }
  return s.firstElementChild;
}
function tutupSheet() {
  const s = $('#sheet'); if (s.hidden) return;
  s.hidden = true; s.innerHTML = ''; sheetKunci = false;
  const cb = sheetSaatTutup; sheetSaatTutup = null; perbaruiBalik();
  if (cb) cb();
}
const sheetTerbuka = () => !$('#sheet').hidden;
function konfirmasi({ judul, isi, tombol, bahaya, batal = 'Batal' }) {
  return new Promise(resolve => {
    let jawab = false;
    bukaSheet(`<div class="sheet-head"><h2 id="sheet-title">${esc(judul)}</h2></div>
      <p class="redup" style="font-size:15px">${isi}</p>
      <button class="btn ${bahaya ? 'btn-coral' : 'btn-mint'} btn-xl" data-act="konfirmasi-ya">${esc(tombol)}</button>
      <button class="btn btn-ghost" data-act="tutup">${esc(batal)}</button>`, { saatTutup: () => resolve(jawab) });
    AKSI['konfirmasi-ya'] = () => { jawab = true; tutupSheet(); };
  });
}
async function salin(teks) {
  try { await navigator.clipboard.writeText(teks); toast('Disalin'); return; } catch (e) {}
  const t = document.createElement('textarea'); t.value = teks; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast('Disalin'); } catch (e) { toast('Gagal nyalin. Tahan teksnya buat salin manual.'); }
  t.remove();
}
function bagikan(teks, link) {
  if (inTG) { try { tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(teks)}`); return; } catch (e) {} }
  if (navigator.share) { navigator.share({ text: `${teks}\n${link}` }).catch(() => {}); return; }
  salin(`${teks}\n${link}`);
}

// Tombol kembali (Telegram) & klik
let halamanBalik = null;
function aksiBalik() {
  if (sheetTerbuka()) { if (!sheetKunci) tutupSheet(); return; }
  if (halamanBalik) { const f = halamanBalik; halamanBalik = null; f(); perbaruiBalik(); }
}
function perbaruiBalik() {
  if (!inTG || !versi('6.1')) return;
  try { (sheetTerbuka() && !sheetKunci) || halamanBalik ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
const AKSI = {};
document.addEventListener('click', e => {
  const s = $('#sheet');
  if (e.target === s && !sheetKunci) { tutupSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'tutup') { tutupSheet(); return; }
  if (AKSI[act]) { e.preventDefault(); AKSI[act](el, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetTerbuka() && !sheetKunci) tutupSheet(); });

  root().innerHTML = `<div class="layar">

    <main class="gulir"><div class="isi gerbang">

function layarLanjut(r) {

AKSI.mulai = async el => {
  try {
    const r = await tombolProses(el, () => api('kuis/mulai', { kode: P.kode, perangkat: namaPerangkat() }));
    if (r.status === 'selesai') return layarHasil(r);
    const lanjut = Object.keys(r.jawaban || {}).length > 0 || r.sisa < r.durasi * 60000 - 15000;
    if (!lanjut) await hitungMundur();
    mulaiUjian(r);
  } catch (e) { toast(pesanError(e)); getar.gagal(); }
};
function namaPerangkat() {
  const ua = navigator.userAgent || '';
  const os = /Android [\d.]+/.exec(ua) || /iPhone OS [\d_]+/.exec(ua) || /Windows NT [\d.]+/.exec(ua) || /Mac OS X [\d_]+/.exec(ua) || ['Perangkat lain'];
  const model = (/;\s*([^;)]+)\s+Build\//.exec(ua) || [])[1];
  return [inTG ? `Telegram ${tg.platform || ''}`.trim() : 'Browser', os[0].replace(/_/g, '.'), model].filter(Boolean).join(', ').slice(0, 150);
}
async function hitungMundur() {
  if (reduced) return;
  const el = document.createElement('div'); el.className = 'hitung'; el.setAttribute('aria-hidden', 'true');
  document.body.appendChild(el);
  for (const t of ['3', '2', '1', 'Mulai!']) {
    el.innerHTML = `<b class="${t.length > 1 ? 'go' : ''}">${t}</b>`;
    const b = el.firstChild; getar.ketuk();
    if (b.animate) b.animate([{ transform: 'scale(1.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: .35 }, { transform: 'scale(.92)', opacity: 1 }], { duration: 620, easing: 'cubic-bezier(.2,.9,.3,1)' });
    await wait(t.length > 1 ? 480 : 640);
  }
  el.remove();
}

function buatWatermark(nama, kode) {
  const t = `${nama}   ${tampilKode(kode)}`.replace(/[<&>"']/g, '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="230" height="150"><text x="115" y="80" text-anchor="middle" transform="rotate(-24 115 75)" font-family="Rubik,Arial,sans-serif" font-size="14" font-weight="700" fill="#26282D">${t}</text></svg>`;
  return `url('data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}')`;
}

function mulaiUjian(r) {
  Object.assign(P, { token: r.token, soal: r.soal, J: {}, RAGU: new Set(r.ragu || []), mulai: r.mulai, batas: r.batas, idx: 0, kotor: new Map(), versi: 0,
    raguKotor: false, peristiwa: [], menyimpan: false, ulang: false, gagal: 0, aktif: true, selesai: false, sudahAwas5: false, sudahAwas1: false });
  P.peserta = r.peserta; P.ujian = r.ujian;
  P.wm = buatWatermark(r.peserta.nama, r.peserta.kode);

  const cadangan = bacaLokal(kunciCadangan());

    for (const [id, v] of Object.entries(cadangan.J || {})) if (P.soal.some(s => s.id === id) && JSON.stringify(P.J[id]) !== JSON.stringify(v)) { if (v == null) delete P.J[id]; else P.J[id] = v; tandaiKotor(id, 600); }
    if (Array.isArray(cadangan.ragu)) { P.RAGU = new Set(cadangan.ragu); P.raguKotor = true; }
  }
  const kosongPertama = P.soal.findIndex(s => P.J[s.id] == null);
  P.idx = Object.keys(P.J).length && kosongPertama >= 0 ? kosongPertama : 0;
  document.body.classList.add('ujian');

      <button class="ikon-btn" data-act="peta" aria-label="Lembar jawaban">${ICON.grid}<span class="titik" id="titik-kosong"></span></button>
    </div></header>
    <main class="gulir" id="gulir-soal"><div id="soal-wadah"></div></main>
    <footer class="bawah"><div class="nav-ujian">
      <button class="btn btn-ghost" data-act="sebelum" aria-label="Soal sebelumnya">${ICON.kiri}</button>
      <button class="btn btn-ragu" data-act="ragu" aria-pressed="false">${ICON.benderaGaris}Ragu-ragu</button>
      <button class="btn btn-coral" id="btn-lanjut" data-act="berikut" aria-label="Soal berikutnya">${ICON.kanan}</button>
    </div></footer>
  </div>
  <div class="peringatan" id="peringatan" role="alert">${ICON.mata}<span><b id="peringatan-judul"></b><span id="peringatan-isi"></span></span></div>`;
  renderSoal(0);
  setStatusSimpan(P.kotor.size ? 'menyimpan' : 'ok');
  clearInterval(P.tWaktu); P.tWaktu = setInterval(detak, 250); detak();
  pasangPengawas();
}
const kunciCadangan = () => `kuis:j:${P.kode}:${P.mulai}`;

function pasangEsai(ta, s) {

AKSI.pilih = el => {
  const s = P.soal[P.idx], i = Number(el.dataset.i);
  if (s.jenis === 'banyak') {
    const set = new Set(P.J[s.id] || []);
    set.has(i) ? set.delete(i) : set.add(i);
    if (set.size) P.J[s.id] = [...set].sort((a, b) => a - b); else delete P.J[s.id];
    el.setAttribute('aria-checked', set.has(i));
  } else {
    P.J[s.id] = i;
    $$('.opsi', el.parentNode).forEach(b => b.setAttribute('aria-checked', Number(b.dataset.i) === i));
  }
  getar.pilih(); tandaiKotor(s.id, 700); renderHudUjian();
};
AKSI.berikut = () => { if (P.idx < P.soal.length - 1) { P.idx++; getar.ketuk(); renderSoal(1); } };
AKSI.sebelum = () => { if (P.idx > 0) { P.idx--; getar.ketuk(); renderSoal(-1); } };

AKSI.kirim = () => kirimAkhir(false);

/* ---------- Simpan otomatis ---------- */
function tandaiKotor(id, tunda = 900) { P.versi++; P.kotor.set(id, P.versi); cadangkan(); jadwalSimpan(tunda); }
function jadwalSimpan(tunda) { if (!P.aktif) return; clearTimeout(P.tSimpan); P.tSimpan = setTimeout(simpan, tunda); if (!P.gagal) setStatusSimpan('menyimpan'); }
function setStatusSimpan(st) {
  const el = $('#status-simpan'); if (!el) return;
  el.className = st === 'gagal' ? 'gagal' : st === 'ok' ? 'ok' : '';
  el.textContent = st === 'gagal' ? 'Offline, disimpan di HP' : st === 'ok' ? 'Tersimpan' : 'Menyimpan…';
}
async function simpan() {
  if (!P.aktif || P.selesai) return;
  if (P.menyimpan) { P.ulang = true; return; }
  if (!P.kotor.size && !P.peristiwa.length && !P.raguKotor) { setStatusSimpan('ok'); return; }
  P.menyimpan = true;
  const kirim = [...P.kotor.entries()], jawaban = {};
  for (const [id] of kirim) jawaban[id] = P.J[id] == null ? null : P.J[id];
  const log = P.peristiwa.slice(0, 50), raguKotor = P.raguKotor;
  P.raguKotor = false;
  try {
    const r = await api('kuis/simpan', { kode: P.kode, token: P.token, jawaban, ragu: [...P.RAGU], log });
    for (const [id, v] of kirim) if (P.kotor.get(id) === v) P.kotor.delete(id);
    P.peristiwa.splice(0, log.length);
    P.gagal = 0;
    if (r.status === 'selesai') { selesaiUjian(); return layarHasil(r); }
    setStatusSimpan(P.kotor.size ? 'menyimpan' : 'ok');
    if (P.kotor.size || P.peristiwa.length || P.raguKotor) jadwalSimpan(500);
  } catch (e) {
    if (raguKotor) P.raguKotor = true;
    if (e.kode === 'SESI') { selesaiUjian(); return layarSesiLain(); }
    P.gagal++; setStatusSimpan('gagal');
    clearTimeout(P.tSimpan); P.tSimpan = setTimeout(simpan, Math.min(20000, 2500 * P.gagal));
  } finally {
    P.menyimpan = false;
    if (P.ulang) { P.ulang = false; jadwalSimpan(300); }
  }
}

/* ---------- Waktu ---------- */
function detak() {
  if (!P.aktif) return;
  const total = Math.max(1, P.batas - P.mulai), sisa = P.batas - sekarang();
  const tm = $('#timer'); if (!tm) return;
  $('#timer-teks').textContent = mmss(sisa);
  $('#ring').style.strokeDashoffset = String(Math.min(100, Math.max(0, 100 - sisa / total * 100)));
  tm.classList.toggle('awas', sisa <= 5 * 60000 && sisa > 60000);
  tm.classList.toggle('kritis', sisa <= 60000);
  tm.setAttribute('aria-label', `Sisa waktu ${mmss(sisa)}`);
  const sk = $('#sisa-kirim'); if (sk) sk.textContent = mmss(sisa);
  if (sisa <= 5 * 60000 && !P.sudahAwas5 && total > 6 * 60000) { P.sudahAwas5 = true; getar.awas(); toast('Sisa 5 menit lagi'); }
  if (sisa <= 60000 && !P.sudahAwas1) { P.sudahAwas1 = true; getar.awas(); toast('Sisa 1 menit. Cek lagi soal yang ragu-ragu.'); }
  if (sisa <= 0) waktuHabis();
}
function waktuHabis() {
  if (!P.aktif || P.selesai) return;
  clearInterval(P.tWaktu);
  kirimAkhir(true);
}
async function kirimAkhir(otomatis) {
  if (P.selesai) return;
  P.selesai = true; clearTimeout(P.tSimpan);
  bukaSheet(`<div class="tengah" style="min-height:auto;padding:20px 8px">
      <div class="spinner" role="status"></div><h2 id="sheet-title">${otomatis ? 'Waktu habis' : 'Ngirim jawaban…'}</h2>
      <p id="kirim-info">${otomatis ? 'Jawaban kamu lagi dikirim otomatis. Jangan tutup app dulu ya.' : 'Tunggu sebentar, jangan tutup app dulu.'}</p></div>`, { kunci: true });
  const jawaban = {};
  for (const s of P.soal) jawaban[s.id] = P.J[s.id] == null ? null : P.J[s.id];
  for (let coba = 1; ; coba++) {
    try {
      const r = await api('kuis/kirim', { kode: P.kode, token: P.token, jawaban, ragu: [...P.RAGU], log: P.peristiwa.slice(0, 50) }, 25000);
      selesaiUjian(); tutupSheet();
      return layarHasil(r, true);
    } catch (e) {
      if (e.kode === 'SESI') { selesaiUjian(); tutupSheet(); return layarSesiLain(); }
      if (e.status >= 400 && e.status < 500) {
        selesaiUjian(); tutupSheet();
        return layarTengah(ICON.info, 'Jawaban nggak bisa dikirim', esc(pesanError(e)), `<button class="btn btn-ghost btn-xl" style="max-width:320px" data-act="ganti-kode">Masukin kode lagi</button>`);
      }
      const info = $('#kirim-info');
      if (info) info.textContent = `Sinyal lagi putus. Nyoba ngirim lagi (${coba})… Jawaban kamu aman di HP.`;
      await wait(Math.min(8000, 2000 * coba));
    }
  }
}
function selesaiUjian() {
  P.aktif = false; clearInterval(P.tWaktu); clearTimeout(P.tSimpan);
  window.onbeforeunload = null; layarPenuh(false); lepasPengawas();
  document.body.classList.remove('ujian');

/* ---------- Pengawas: keluar app & tempel ---------- */
let luarSejak = null, luarTercatat = false, tLuar = null;
const eid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function catat(jenis, extra = {}) { P.peristiwa.push(Object.assign({ eid: eid(), jenis, t: sekarang() }, extra)); }
function keluarHalaman(pasti) {
  if (!P.aktif || luarSejak) return;
  luarSejak = sekarang(); luarTercatat = false;
  const rekam = () => {
    if (!luarSejak || luarTercatat) return;
    luarTercatat = true; catat('keluar', { t: luarSejak });
    beacon('kuis/simpan', { kode: P.kode, token: P.token, jawaban: {}, log: P.peristiwa.slice(0, 50) });
  };
  clearTimeout(tLuar);
  if (pasti) rekam(); else tLuar = setTimeout(rekam, 1000);
}
function balikHalaman() {
  if (!P.aktif || !luarSejak) return;
  clearTimeout(tLuar);
  const lama = sekarang() - luarSejak;
  if (luarTercatat || lama >= 1000) {
    if (!luarTercatat) catat('keluar', { t: luarSejak });
    catat('kembali', { detik: Math.round(lama / 1000) });
    P.keluar++; getar.awas();
    tampilPeringatan(lama);
    jadwalSimpan(200);
  }
  luarSejak = null; luarTercatat = false;
}
function tampilPeringatan(lama) {
  const el = $('#peringatan'); if (!el) return;
  $('#peringatan-judul').textContent = `Kamu keluar dari ujian (${P.keluar}×)`;
  $('#peringatan-isi').textContent = `Selama ${lamaDetik(lama / 1000)}. Ini tercatat dan kelihatan sama admin.`;
  el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 4200);
}
const onVis = () => (document.hidden ? keluarHalaman(true) : balikHalaman());
const onBlur = () => keluarHalaman(false), onFocus = () => balikHalaman();
const onDeact = () => keluarHalaman(true), onAct = () => balikHalaman();
const tolakSalin = e => { if (P.aktif && !(e.target && e.target.closest && e.target.closest('textarea'))) e.preventDefault(); };
function pasangPengawas() {
  lepasPengawas();
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('blur', onBlur); window.addEventListener('focus', onFocus);
  window.addEventListener('pagehide', onDeact);
  document.addEventListener('copy', tolakSalin); document.addEventListener('cut', tolakSalin); document.addEventListener('contextmenu', tolakSalin);
  try { if (inTG && versi('8.0')) { tg.onEvent('deactivated', onDeact); tg.onEvent('activated', onAct); } } catch (e) {}
}
function lepasPengawas() {
  document.removeEventListener('visibilitychange', onVis);
  window.removeEventListener('blur', onBlur); window.removeEventListener('focus', onFocus);
  window.removeEventListener('pagehide', onDeact);
  document.removeEventListener('copy', tolakSalin); document.removeEventListener('cut', tolakSalin); document.removeEventListener('contextmenu', tolakSalin);
  try { if (inTG && versi('8.0')) { tg.offEvent('deactivated', onDeact); tg.offEvent('activated', onAct); } } catch (e) {}
  luarSejak = null; clearTimeout(tLuar);
}

  return `<div class="cincin"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" stroke="var(--raised)"/><circle cx="48" cy="48" r="40" stroke="${warna}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - v}" stroke-linecap="round"/></svg><b>${nilai == null ? '–' : fmtNilai(nilai)}</b></div>`;
}

AKSI['edit-soal'] = el => {
  const s = (el.dataset.id && A.bank.soal.find(x => x.id === el.dataset.id)) || { jenis: 'pilihan', topik: '', poin: 6, konteks: '', teks: '', opsi: [{ teks: '' }, { teks: '' }, { teks: '' }, { teks: '' }], penjelasan: '', rubrik: [], aktif: true };
  const topik = [...new Set(A.bank.soal.map(x => x.topik).filter(Boolean))];
  const drafAi = s.sumber === 'ai';
  bukaSheet(`<div class="sheet-head"><h2 id="sheet-title">${drafAi ? 'Cek soal dari AI' : s.id ? 'Edit soal' : 'Soal baru'}</h2><button class="ikon-btn" data-act="tutup" aria-label="Tutup">${ICON.x}</button></div>
    ${drafAi ? `<p class="catatan">${ICON.info}<span>Soal ini dibuat AI. Pastiin jawaban yang dicentang emang benar dan bahasanya enak dibaca. Kalau udah oke, ketuk Simpan dan soalnya langsung aktif.</span></p>` : ''}
    <form id="f-soal" class="isi" novalidate>
      <fieldset class="field"><legend>Jenis soal</legend><div class="segmen">${Object.keys(JENIS).map(j => `<label><input type="radio" name="jenis" value="${j}" ${s.jenis === j ? 'checked' : ''}><span>${JENIS[j].label}</span></label>`).join('')}</div></fieldset>
      <div class="dua"><div class="field"><label for="e-topik">Topik</label><input class="inp" id="e-topik" list="daftar-topik" maxlength="40" value="${esc(s.topik)}" placeholder="Misal: Pengukuran"><datalist id="daftar-topik">${topik.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
      <div class="field"><label for="e-poin">Poin</label><input class="inp" id="e-poin" type="number" inputmode="decimal" min="0.5" max="50" step="0.5" value="${s.poin}"></div></div>
      <div class="field"><label for="e-konteks">Konteks kasus <small>(opsional)</small></label><textarea class="inp" id="e-konteks" rows="3" maxlength="2000" placeholder="Cerita situasi yang dihadapi peserta">${esc(s.konteks)}</textarea></div>
      <div class="field" id="blok-tabel"><label for="e-tabel">Tabel data <small>(baris pertama = judul kolom, pisahkan kolom pakai |)</small></label><textarea class="inp" id="e-tabel" rows="4" style="font-variant-numeric:tabular-nums" placeholder="Ad set | Biaya | Lead&#10;A | Rp1.500.000 | 30">${esc(tabelKeTeks(s.tabel))}</textarea></div>
      <div class="field"><label for="e-teks">Pertanyaan</label><textarea class="inp" id="e-teks" rows="3" maxlength="2000">${esc(s.teks)}</textarea></div>
      <fieldset class="field" id="blok-opsi"><legend>Pilihan jawaban <small id="ket-benar"></small></legend><div class="isi" id="daftar-opsi" style="gap:8px">${(s.opsi || []).map(o => barisOpsi(o, s.jenis)).join('')}</div>
        <button type="button" class="btn btn-ghost btn-kecil" data-act="tambah-opsi" style="margin-top:8px">${ICON.tambah}Tambah pilihan</button></fieldset>
      <div class="field" id="blok-rubrik"><label for="e-rubrik">Rubrik penilaian <small>(1 baris = 1 hal yang dicari dari jawaban)</small></label><textarea class="inp" id="e-rubrik" rows="5">${esc((s.rubrik || []).join('\n'))}</textarea></div>
      <div class="field"><label for="e-bahas">Pembahasan <small>(cuma admin yang lihat)</small></label><textarea class="inp" id="e-bahas" rows="3" maxlength="1500">${esc(s.penjelasan)}</textarea></div>
      <label class="saklar"><span>Soal aktif<small>Soal nonaktif nggak muncul buat peserta baru</small></span><input type="checkbox" id="e-aktif" ${s.aktif || drafAi ? 'checked' : ''}></label>
      <p class="err" id="e-err" role="alert" hidden></p>
      <button class="btn btn-mint btn-xl" id="e-kirim" type="submit">Simpan soal</button>
      ${s.id ? `<button type="button" class="btn btn-bahaya" data-act="hapus-soal" data-id="${esc(s.id)}">${ICON.sampah}Hapus soal</button>` : ''}
    </form>`, { full: true });
  const form = $('#f-soal');
  const sesuaikan = () => {
    const j = form.jenis.value, esai = j === 'esai', banyak = j === 'banyak';
    $('#blok-opsi').hidden = esai; $('#blok-rubrik').hidden = !esai; $('#blok-tabel').hidden = esai;
    $('#ket-benar').textContent = banyak ? '(centang semua yang benar)' : '(tandai 1 yang benar)';
    $$('.tanda-benar', form).forEach(inp => { inp.type = banyak ? 'checkbox' : 'radio'; inp.classList.toggle('kotak', banyak); });
    if (!banyak) { const c = $$('.tanda-benar:checked', form); c.slice(1).forEach(x => { x.checked = false; }); }
  };
  form.addEventListener('change', e => { if (e.target.name === 'jenis') sesuaikan(); });
  sesuaikan();
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const jenis = form.jenis.value;
    const data = {
      id: s.id, jenis, topik: $('#e-topik').value, poin: Number($('#e-poin').value), konteks: $('#e-konteks').value, teks: $('#e-teks').value,
      tabel: jenis === 'esai' ? null : teksKeTabel($('#e-tabel').value), penjelasan: $('#e-bahas').value, aktif: $('#e-aktif').checked,
      opsi: jenis === 'esai' ? null : $$('.opsi-edit', form).map(r => ({ id: r.dataset.id || undefined, teks: $('textarea', r).value, benar: $('.tanda-benar', r).checked })),
      rubrik: jenis === 'esai' ? $('#e-rubrik').value.split('\n').map(x => x.trim()).filter(Boolean) : null,
    };
    try {
      A.bank = await tombolProses($('#e-kirim'), () => api('kuis/admin/soal-simpan', { soal: data }));
      A.data = await api('kuis/admin/ringkas').catch(() => A.data); A.analisis = null;
      getar.sukses(); tutupSheet(); renderAdmin(); toast('Soal disimpan');
    } catch (ex) { const err = $('#e-err'); err.textContent = pesanError(ex); err.hidden = false; err.scrollIntoView({ block: 'center' }); getar.gagal(); }
  });
};
AKSI['tambah-opsi'] = () => {
  const box = $('#daftar-opsi');
  if (box.children.length >= 8) { toast('Maksimal 8 pilihan'); return; }
  box.insertAdjacentHTML('beforeend', barisOpsi({ teks: '' }, $('#f-soal').jenis.value));
  box.lastElementChild.querySelector('textarea').focus();
};
AKSI['hapus-opsi'] = el => { if ($('#daftar-opsi').children.length <= 2) { toast('Minimal 2 pilihan'); return; } el.closest('.opsi-edit').remove(); };
AKSI['hapus-soal'] = async el => {
  const id = el.dataset.id;
  tutupSheet();
  if (!await konfirmasi({ judul: 'Hapus soal ini?', isi: 'Soal ini dihapus dari bank dan dari hitungan nilai semua peserta. Kalau cuma mau disembunyiin, mending dinonaktifkan aja.', tombol: 'Hapus soal', bahaya: true })) return;
  try { A.bank = await api('kuis/admin/soal-hapus', { id }); A.data = await api('kuis/admin/ringkas').catch(() => A.data); A.analisis = null; renderAdmin(); toast('Soal dihapus'); } catch (e) { toast(pesanError(e)); }
};

/* ---------- Tab atur ---------- */
function tabAtur() {
  const a = A.data.atur;
  const saklar = (id, judul, ket, on) => `<label class="saklar"><span>${judul}<small>${ket}</small></span><input type="checkbox" id="${id}" ${on ? 'checked' : ''}></label>`;
  return `<div class="isi"><form class="isi" id="f-atur" novalidate>
    <div class="kartu">
      ${saklar('a-buka', 'Ujian dibuka', 'Kalau dimatiin, peserta baru nggak bisa mulai.', a.buka)}
      ${saklar('a-daftar', 'Pendaftaran lewat bot dibuka', 'Sales bisa daftar sendiri pakai /daftarkuis.', a.daftarBot !== false)}
      <div class="dua"><div class="field"><label for="a-jumlah">Soal per peserta</label><input class="inp" id="a-jumlah" type="number" inputmode="numeric" min="0" max="200" placeholder="Semua" value="${a.jumlahSoal || ''}"></div>
      <div class="field"><label for="a-durasi">Waktu (menit)</label><input class="inp" id="a-durasi" type="number" inputmode="numeric" min="5" max="180" value="${a.durasi}"></div></div>
      <p class="redup kecil" style="margin-top:-4px">Ada ${A.data.ujian.bank} soal aktif. Kalau soal per peserta diisi lebih kecil, tiap orang dapat soal acak yang beda-beda. Kosongin buat pakai semua soal.</p>
      <div class="field"><label for="a-kkm">Nilai lulus</label><input class="inp" id="a-kkm" type="number" inputmode="numeric" min="0" max="100" value="${a.kkm}"></div>
    </div>
    <div class="kartu">
      ${saklar('a-topup', 'Minta VA BCA otomatis ke yang lulus', 'Bot ngirim cara top up dana iklan begitu peserta lulus.', a.topupAktif !== false)}
      <div class="field"><label for="a-nominal">Nominal top up (Rp)</label><input class="inp" id="a-nominal" inputmode="numeric" placeholder="Kosongin kalau beda-beda" value="${a.nominalTopup ? Number(a.nominalTopup).toLocaleString('id-ID') : ''}"><small class="redup kecil">Disebut di tutorial bot biar sales ngisi jumlah yang pas. Kalau dikosongin, sales disuruh tanya admin dulu.</small></div>
    </div>
    <details class="kartu lipat"><summary>Pengaturan lainnya</summary><div class="isi" style="margin-top:14px">
      ${saklar('a-tampil', 'Tunjukin nilai ke peserta', 'Kunci jawaban tetap disembunyiin.', a.tampilNilai)}
      ${saklar('a-kabari', 'Kabari aku lewat bot', 'Tiap ada pendaftar baru atau peserta selesai.', a.kabariAdmin)}
      <div class="field"><label for="a-judul-inp">Judul ujian</label><input class="inp" id="a-judul-inp" maxlength="60" value="${esc(a.judul)}"></div>
      <div class="field"><label for="a-sub">Keterangan</label><input class="inp" id="a-sub" maxlength="80" value="${esc(a.subjudul)}"></div>
      <div class="field"><label for="a-petunjuk">Pesan sebelum mulai ujian <small>(opsional)</small></label><textarea class="inp" id="a-petunjuk" rows="3" maxlength="800" placeholder="Misal: Kerjakan sebelum Jumat jam 17.00.">${esc(a.petunjuk)}</textarea></div>
      <div class="field"><label for="a-model">Model AI buat bikin soal <small>(${A.data.ai ? 'OpenRouter tersambung' : 'OpenRouter belum disambungin'})</small></label><input class="inp" id="a-model" maxlength="100" value="${esc(a.modelAi || 'openrouter/free')}" autocapitalize="off" spellcheck="false"><small class="redup kecil">Biarin <b>openrouter/free</b> buat pakai model gratis. Ganti ke nama model lain dari openrouter.ai kalau mau hasil lebih bagus (berbayar).</small></div>
    </div></details>
    <p class="err" id="a-err" hidden></p>
    <button class="btn btn-mint btn-xl" id="a-kirim" type="submit">Simpan</button>
  </form></div>`;
}
function pasangFormAtur() {
  const f = $('#f-atur'); if (!f) return;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const atur = { judul: $('#a-judul-inp').value, subjudul: $('#a-sub').value, jumlahSoal: $('#a-jumlah').value, durasi: Number($('#a-durasi').value), kkm: Number($('#a-kkm').value), petunjuk: $('#a-petunjuk').value,
      buka: $('#a-buka').checked, tampilNilai: $('#a-tampil').checked, kabariAdmin: $('#a-kabari').checked, daftarBot: $('#a-daftar').checked, modelAi: $('#a-model').value, topupAktif: $('#a-topup').checked, nominalTopup: $('#a-nominal').value };
    const err = $('#a-err'); err.hidden = true;
    try { const r = await tombolProses($('#a-kirim'), () => api('kuis/admin/atur', { atur })); A.data.atur = r.atur; A.data = await api('kuis/admin/ringkas').catch(() => A.data); getar.sukses(); renderAdmin(); toast('Pengaturan disimpan'); }
    catch (ex) { err.textContent = pesanError(ex); err.hidden = false; getar.gagal(); }
  });
}

/* ================= MULAI ================= */
async function boot() {
  siapkanTelegram();
  layarMemuat();
  const q = new URLSearchParams(location.search);
  const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const kodeLink = q.get('kode') || (/^[A-Za-z0-9]{6}$/.test(startParam) ? startParam : '');
  const bukaPeserta = q.get('peserta') || (/^p_[A-Za-z0-9]{6}$/.test(startParam) ? startParam.slice(2) : '');
  const sinyal = e => layarTengah(ICON.sinyal, 'Server nggak kehubung', esc(pesanError(e)), `<button class="btn btn-ghost btn-xl" style="max-width:320px" data-act="boot">${ICON.ulang}Coba lagi</button>`);
  if (inTG && !pratinjauAdmin) {
    let saya = null;
    try { saya = await api('kuis/saya'); } catch (e) { if (e.status === 0) return sinyal(e); }
    if (saya && saya.admin) {
      try { return mulaiAdmin(await api('kuis/admin/ringkas'), bukaPeserta || kodeLink); } catch (e) { if (e.status === 0) return sinyal(e); }
    }
    if (kodeLink) return layarGerbang(kodeLink);
    if (saya && saya.kode) return layarGerbang(saya.kode);
    if (saya && saya.status === 'tunggu') return layarTengah(ICON.jam, 'Pendaftaran kamu lagi dicek', 'Admin lagi ngecek data kamu. Begitu disetujui, kode ujian dikirim ke chat bot ini dan langsung keisi di sini.',
      `<button class="btn btn-ghost btn-xl" style="max-width:320px" data-act="boot">${ICON.ulang}Cek lagi</button><button class="link-btn" data-act="ganti-kode">Udah punya kode? Masukin manual</button>`);
    if (saya && saya.status === 'tolak') return layarTengah(ICON.info, 'Pendaftaran belum disetujui', 'Cek alasannya di chat bot, lalu daftar ulang pakai /daftarkuis kalau ada data yang perlu dibenerin.',
      `<button class="link-btn" data-act="ganti-kode">Udah punya kode? Masukin manual</button>`);
  }
  layarGerbang(kodeLink);
}
AKSI.boot = () => boot();
boot();
</script>
