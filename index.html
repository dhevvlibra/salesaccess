<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E2428">
<title>Sales Quest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Arah: HUD game di atas peta kontur lapangan. Teal gelap, tombol tebal 3D, koral buat aksi, emas buat XP. */
  --ink:#0E2428;
  --surface:#15353B;
  --raised:#1F474E;
  --line:#2D5C63;
  --paper:#F4EEDF;
  --muted:#A6C0BB;
  --coral:#FF6A3D; --coral-d:#B63F1A;
  --sun:#FFC23D;   --sun-d:#B5830C;
  --mint:#4FE0A6;  --mint-d:#1E976A;
  --sky:#86CCFF;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-top:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  --safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea,.bubble{-webkit-user-select:text;user-select:text}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#kontur,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#kontur{z-index:0}
#confetti{z-index:60}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- HUD ---------- */
.hud{padding:calc(var(--safe-top) + 12px) 16px 10px}
.hud-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.avatar{position:relative;width:54px;height:54px;border-radius:17px;background:var(--coral);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;box-shadow:0 4px 0 var(--coral-d)}
.avatar .lv{position:absolute;right:-9px;bottom:-9px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:400;font-size:13px;display:grid;place-items:center;border:3px solid var(--ink)}
.who{min-width:0}
.name{margin:0;font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.gelar{margin:1px 0 0;font-size:12px;font-weight:600;color:var(--sun)}
.xpbar{margin-top:7px;height:12px;border-radius:6px;background:var(--surface);box-shadow:inset 0 2px 0 rgba(0,0,0,.3);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--sun),#FFE39A);transition:width .7s cubic-bezier(.25,.9,.3,1.15)}
.xpbar.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scaleY(1.6)}}
.xptext{margin:4px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.xptext b{font-family:var(--display);font-weight:400;color:var(--paper);margin-right:8px}
.streak-pill{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 10px;border-radius:15px;background:var(--surface);border:2px solid var(--raised)}
.streak-pill svg{width:22px;height:22px;color:var(--coral)}
.streak-pill b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1}
.streak-pill.mati svg{color:var(--muted);opacity:.7}

main{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 16px 28px}
.view{display:flex;flex-direction:column;gap:16px;animation:muncul .35s ease both}
@keyframes muncul{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}

.greet .date{margin:0;font-size:13px;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;text-wrap:balance}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h1{margin:0}
.sec{margin:8px 0 -4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.tag{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}

.card{background:var(--surface);border:2px solid var(--raised);border-radius:20px;padding:16px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--raised);color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.s-closing{background:var(--sun);color:var(--ink)}
.s-tertarik{background:var(--mint);color:var(--ink)}
.s-pikir{background:var(--sky);color:var(--ink)}
.s-tidak,.s-belum{background:var(--raised);color:var(--muted)}
.s-warn{background:rgba(255,106,61,.18);color:#FF9B7A}

.note{margin:0;display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:13px;color:var(--muted);padding:10px 12px;border:1.5px dashed var(--line);border-radius:14px}
.note svg{flex:none;width:18px;height:18px;color:var(--sky);margin-top:1px}

/* ---------- Tombol ---------- */
.btn{--sh:#BDB4A1;appearance:none;border:0;margin:0;font:inherit;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em;color:var(--ink);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--sh);cursor:pointer;text-align:center;transition:transform .08s ease,box-shadow .08s ease,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn svg{width:22px;height:22px;flex:none}
.btn-coral{--sh:var(--coral-d);background:var(--coral)}
.btn-mint{--sh:var(--mint-d);background:var(--mint)}
.btn-sun{--sh:var(--sun-d);background:var(--sun)}
.btn-ghost{--sh:transparent;background:transparent;color:var(--paper);border:2px solid var(--line);font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0}
.btn-ghost:active{transform:translateY(2px)}
.btn-xl{width:100%;min-height:62px;font-size:18px}
.btn[disabled]{filter:saturate(.3) brightness(.75);cursor:default;pointer-events:none}
.reward{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:0;padding:4px 9px;border-radius:999px;background:rgba(14,36,40,.16)}
.link-btn{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:10px;align-self:center;cursor:pointer}
.icon-btn{appearance:none;flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--raised);background:var(--surface);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}

/* ---------- Kartu absen ---------- */
.absen-card{display:flex;flex-direction:column;gap:14px;padding:18px;background:radial-gradient(130% 100% at 100% 0%,rgba(255,106,61,.22),transparent 60%),var(--surface)}
.absen-card.on{background:radial-gradient(130% 100% at 100% 0%,rgba(79,224,166,.18),transparent 60%),var(--surface)}
.absen-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.absen-headline{margin:0;font-family:var(--display);font-size:clamp(24px,7.5vw,32px);line-height:1.08;text-wrap:balance}
.absen-sub{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.absen-sub.flat,.absen-row .absen-sub{margin:0}
.absen-row{display:flex;gap:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--mint);flex:none;background:var(--raised)}
.thumb-kosong{display:grid;place-items:center;color:var(--muted)}
.thumb-kosong svg{width:26px;height:26px}
.absen-time{margin:0;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--ink);border-radius:14px;padding:10px 12px}
.duo span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.duo b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.gold{color:var(--sun)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.gold b{color:var(--sun)}

/* ---------- Misi ---------- */
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.quest{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px}
.q-ico{width:44px;height:44px;border-radius:13px;background:var(--raised);color:var(--sun);display:grid;place-items:center}
.q-ico svg{width:24px;height:24px}
.q-title{margin:0;font-weight:600;font-size:15px;line-height:1.25}
.q-bar{margin-top:7px;height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.q-bar i{display:block;height:100%;border-radius:4px;background:var(--mint);transition:width .6s ease}
.q-meta{margin:4px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-reward{font-family:var(--display);font-size:14px;color:var(--sun);white-space:nowrap}
.q-ok{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--ink);display:grid;place-items:center}
.q-ok svg{width:20px;height:20px}
.quest.done{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,194,61,.15)}
.quest.done .q-ico{background:var(--sun);color:var(--ink)}
.quest.claimed .q-title{color:var(--muted)}
.quest.gagal{border-style:dashed;border-color:var(--line)}
.quest.gagal .q-ico{color:var(--muted)}
.quest.gagal .q-reward{color:var(--muted);text-decoration:line-through}
.btn-claim{min-height:42px;padding:8px 12px;font-size:13px;border-radius:13px;box-shadow:0 4px 0 var(--sh);animation:goyang 2.4s ease-in-out infinite}
.btn-claim:active{box-shadow:0 1px 0 var(--sh);animation:none}
@keyframes goyang{0%,80%,100%{transform:none}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}

/* ---------- Streak ---------- */
.streak-card{display:flex;flex-direction:column;gap:14px}
.streak-card>p{margin:0;font-size:14px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.day.now{color:var(--sun)}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--ink);border:2px solid var(--raised);display:grid;place-items:center;color:var(--ink)}
.dot svg{width:58%;height:58%}
.dot.on{background:var(--coral);border-color:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.dot.today{border:2px dashed var(--sun)}
.dot.today.on{border-style:solid;border-color:var(--coral)}

/* ---------- Form kunjungan ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend,.label{font-size:13px;font-weight:600;color:var(--muted)}
.field>legend{padding:0;margin-bottom:7px}
.label small,.field>legend small{font-weight:500;opacity:.85}
.inp{font:inherit;font-size:16px;color:var(--paper);background:var(--surface);border:2px solid var(--raised);border-radius:14px;padding:13px 14px;width:100%;outline:none;transition:border-color .15s}
.inp::placeholder{color:#6F8D89}
.inp:focus{border-color:var(--sun)}
textarea.inp{resize:vertical;min-height:84px}
.inp[aria-invalid="true"]{border-color:var(--coral)}
.err{margin:0;font-size:13px;color:#FF9B7A;font-weight:600}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:14px;border:2px solid var(--raised);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--raised);transition:transform .08s,box-shadow .08s,background .15s}
.choice span em{font-style:normal;font-size:12px;font-weight:800;opacity:.75}
.choice:active span{transform:translateY(2px);box-shadow:0 1px 0 var(--raised)}
.choice input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.choice input:checked+span{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 3px 0 #BDB4A1}
.choice[data-s="closing"] input:checked+span{background:var(--sun);border-color:var(--sun);box-shadow:0 3px 0 var(--sun-d)}
.choice[data-s="tertarik"] input:checked+span{background:var(--mint);border-color:var(--mint);box-shadow:0 3px 0 var(--mint-d)}
.choice[data-s="pikir"] input:checked+span{background:var(--sky);border-color:var(--sky);box-shadow:0 3px 0 #4B8FC4}
.choice[data-s="tidak"] input:checked+span{background:var(--raised);color:var(--paper);border-color:var(--line);box-shadow:0 3px 0 #0A1A1D}
.foto-row{display:flex;gap:12px;align-items:center}
.foto-prev{width:64px;height:64px;border-radius:14px;object-fit:cover;border:2px solid var(--mint);flex:none}

.kunci{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px}
.kunci-ico{width:76px;height:76px;border-radius:24px;background:var(--raised);color:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #0A1A1D;margin-bottom:6px}
.kunci-ico svg{width:38px;height:38px}
.kunci-title{margin:0;font-family:var(--display);font-size:22px}
.kunci-sub{margin:0 0 8px;color:var(--muted);font-size:14px;max-width:32ch}

/* ---------- Riwayat ---------- */
.rekap-card{display:flex;flex-direction:column;gap:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.timeline::before{content:"";position:absolute;left:23px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.tl{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:6px 0;align-items:start}
.tl-time{position:relative;z-index:1;justify-self:center;margin-top:10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--paper);border:2px solid var(--raised);border-radius:10px;padding:3px 5px}
.tl-absen .tl-time{border-color:var(--mint);color:var(--mint)}
.tl-body{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:10px 12px;min-width:0}
.tl-text{flex:1;min-width:0}
.tl-title{margin:0;font-weight:600;font-size:15px;line-height:1.35}
.tl-sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tl-note{margin:6px 0 0;font-size:13px;opacity:.88;border-left:3px solid var(--line);padding-left:8px}
.tl-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.tl-foto{width:44px;height:44px;border-radius:12px;object-fit:cover}
.tl-foto.bulat{border-radius:50%}
.xp-chip{font-family:var(--display);font-size:12px;color:var(--sun);white-space:nowrap}
.kosong{margin:0;color:var(--muted);font-size:14px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}

/* ---------- Tab bawah ---------- */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px calc(12px + var(--safe-bot));background:linear-gradient(to bottom,rgba(14,36,40,0),var(--ink) 35%)}
.tab{position:relative;appearance:none;margin:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 4px 0 #0A1A1D;transition:transform .08s,box-shadow .08s}
.tab svg{width:24px;height:24px}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #0A1A1D}
.tab[aria-current="page"]{background:var(--paper);border-color:var(--paper);color:var(--ink);box-shadow:0 4px 0 #BDB4A1}
.tab .badge{position:absolute;top:6px;right:calc(50% - 22px);width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--surface)}
.tab[aria-current="page"] .badge{border-color:var(--paper)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,16,18,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-panel{width:100%;max-width:560px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);border:2px solid var(--raised);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + var(--safe-bot));display:flex;flex-direction:column;gap:16px;animation:naik .32s cubic-bezier(.2,.9,.3,1) both}
.sheet-panel.full{min-height:100%;border-radius:0;border:0;padding-top:calc(var(--safe-top) + 14px)}
.sheet-panel.diam{animation:none}
@keyframes naik{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
h2[tabindex]:focus{outline:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.step i{height:6px;border-radius:3px;background:var(--raised)}
.step.on{color:var(--paper)}
.step.on i{background:var(--coral)}
.step.lewat i{background:var(--mint)}
.flow-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;animation:muncul .3s ease both}
.flow-title{margin:0;font-family:var(--display);font-size:22px;line-height:1.15}
.flow-sub{margin:0;color:var(--muted);font-size:14px}
.coords{margin:0;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;letter-spacing:.02em}
.flow-actions{display:flex;flex-direction:column;gap:12px}

.radar{position:relative;width:min(220px,60vw);aspect-ratio:1;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--raised);background:radial-gradient(circle,rgba(79,224,166,.10) 0 30%,transparent 31%),repeating-radial-gradient(circle,transparent 0 26px,rgba(166,192,187,.12) 26px 28px)}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(166,192,187,.12)}
.radar::before{left:50%;top:8%;bottom:8%;width:2px;transform:translateX(-50%)}
.radar::after{top:50%;left:8%;right:8%;height:2px;transform:translateY(-50%)}
.radar span{position:absolute;inset:0;border-radius:50%;border:3px solid var(--mint);opacity:0;animation:ping 2.4s ease-out infinite}
.radar span:nth-child(2){animation-delay:.8s}
.radar span:nth-child(3){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.radar .pin{position:relative;z-index:1;width:64px;height:64px;color:var(--coral);filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:lompat 1.1s ease-in-out infinite}
@keyframes lompat{50%{transform:translateY(-10px)}}
.radar.dapat{border-color:var(--mint);box-shadow:0 0 0 6px rgba(79,224,166,.12)}
.radar.dapat span,.radar.gagal span{animation:none;opacity:0}
.radar.dapat .pin{animation:mendarat .45s cubic-bezier(.2,1.6,.4,1) both}
.radar.gagal .pin{color:var(--muted);animation:none}
@keyframes mendarat{from{transform:translateY(-24px)}to{transform:none}}

.selfie{width:min(230px,62vw);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;border:4px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.selfie svg{width:44px;height:44px;color:var(--paper)}
.selfie img{width:100%;height:100%;object-fit:cover}
.selfie.ada{border:4px solid var(--mint);box-shadow:0 6px 0 var(--mint-d)}

.ringkas{display:flex;gap:14px;align-items:center;text-align:left}
.ringkas img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--mint);flex:none}
.ringkas dl{margin:0;display:grid;gap:6px;flex:1;min-width:0}
.ringkas dl div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ringkas dt{color:var(--muted)}
.ringkas dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hadiah{list-style:none;margin:0;padding:12px 14px;border-radius:16px;background:var(--surface);border:2px dashed var(--sun-d);display:flex;flex-direction:column;gap:8px;text-align:left}
.hadiah li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hadiah b{font-family:var(--display);font-weight:400;color:var(--sun)}
.hadiah .total{border-top:2px solid var(--raised);padding-top:8px;font-weight:700}
.hadiah .total b{font-size:18px}

.sukses{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.ring{width:140px;height:140px;border-radius:50%;background:var(--mint);color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 0 var(--mint-d);animation:pop .55s cubic-bezier(.2,1.7,.4,1) both;margin-bottom:10px}
.ring svg{width:74px;height:74px}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.sukses-title{margin:0;font-weight:700;font-size:18px}
.big-xp{margin:0;font-family:var(--display);font-size:52px;line-height:1;color:var(--sun);text-shadow:0 5px 0 var(--sun-d);animation:pop .6s .15s cubic-bezier(.2,1.7,.4,1) both}

.levelup{align-items:center;text-align:center;padding-top:28px}
.lu-kicker{margin:0;font-family:var(--display);font-weight:400;font-size:28px;color:var(--sun);text-shadow:0 4px 0 var(--sun-d)}
.shield{width:130px;height:148px;background:var(--coral);clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.7,.4,1) both}
.shield span{font-family:var(--display);font-size:64px;color:var(--ink);margin-top:-10px}
.lu-gelar{margin:0;font-weight:700;font-size:18px}
.levelup .btn{align-self:stretch}

.chat{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:20px;background:#0A1B1E;border:2px solid var(--raised)}
.chat-from{margin:0;font-size:13px;font-weight:700;color:var(--sky)}
.bubble{background:var(--surface);border-radius:18px 18px 18px 6px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.5;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.chat-time{margin:0;font-size:11px;color:var(--muted);text-align:right}

.toast{position:fixed;left:50%;bottom:calc(98px + var(--safe-bot));z-index:40;transform:translate(-50%,16px);opacity:0;background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.float-xp{position:fixed;z-index:55;font-family:var(--display);font-size:22px;color:var(--sun);text-shadow:0 3px 0 var(--sun-d);pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ---------- v2: layar penuh (boot, login, setup) ---------- */
#root{position:relative;z-index:1;height:100%}
.layar{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-top) + 24px) 16px calc(var(--safe-bot) + 28px);display:flex;flex-direction:column;align-items:center}
.layar>*{width:100%;max-width:440px}
.layar.tengah{justify-content:center;text-align:center;gap:14px}
.emblem{width:92px;height:104px;background:var(--coral);clip-path:polygon(50% 0,100% 14%,100% 60%,50% 100%,0 60%,0 14%);display:grid;place-items:center;color:var(--ink);margin:0 auto;filter:drop-shadow(0 6px 0 var(--coral-d))}
.emblem svg{width:44px;height:44px;margin-top:-8px}
.judul-app{margin:14px 0 0;font-family:var(--display);font-size:clamp(40px,13vw,58px);line-height:.95;letter-spacing:.01em;text-align:center;color:var(--paper);text-shadow:0 5px 0 var(--coral-d)}
.tagline{margin:10px 0 0;text-align:center;color:var(--muted);font-size:15px}
.muat{margin:6px 0 0;color:var(--muted);font-size:14px}
.loader{width:160px;height:10px;margin:8px auto 0;border-radius:5px;background:var(--surface);overflow:hidden}
.loader i{display:block;width:40%;height:100%;border-radius:5px;background:var(--sun);animation:loader 1.1s ease-in-out infinite}
@keyframes loader{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.auth-hero{padding:8px 0 22px;animation:muncul .4s ease both}
.auth-card{display:flex;flex-direction:column;gap:16px;padding:20px 18px;animation:naik .4s .05s cubic-bezier(.2,.9,.3,1) both}
.auth-judul{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.auth-sub{margin:-8px 0 0;font-size:14px;color:var(--muted)}
.auth-foot{margin:18px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.inp-ikon{position:relative}
.inp-ikon>svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.inp-ikon .inp{padding-left:44px}
.inp-ikon .inp.ada-mata{padding-right:52px}
.mata{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.mata svg{width:20px;height:20px}
.demo-hint{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:14px}
.demo-hint p{margin:0;font-size:13px;color:var(--muted)}
.demo-hint .choices{gap:6px}
.isi-cepat{appearance:none;border:2px solid var(--raised);background:var(--ink);color:var(--paper);font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;cursor:pointer}
.isi-cepat b{color:var(--sun);font-weight:700}
.err-box{margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,106,61,.14);color:#FF9B7A;font-size:14px;font-weight:600}

/* ---------- v2: HUD tambahan ---------- */
button.avatar{border:0;cursor:pointer;font:inherit;font-family:var(--display);font-size:24px;padding:0}
.lv-admin{padding:0!important}
.lv-admin svg{width:14px;height:14px}
.badge-peran{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.04em;vertical-align:1px}
.hud .icon-btn{width:48px;height:48px}

/* ---------- v2: admin ---------- */
.stats.empat{grid-template-columns:repeat(4,1fr);gap:8px}
.stats.empat .stat{padding:10px}
.stats.empat .stat b{font-size:22px}
.stat.warn b{color:#FF9B7A}
.stat.mint b{color:var(--mint)}
.stat.sky b{color:var(--sky)}
.saring{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.saring::-webkit-scrollbar{display:none}
.saring .choice span{white-space:nowrap;min-height:40px;padding:8px 12px}
.daftar{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.orang{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px;color:inherit;font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 0 #0A1A1D;transition:transform .08s,box-shadow .08s}
.orang:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1A1D}
.inisial{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink);flex:none}
.orang-nama{margin:0;font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.orang-sub{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.orang-kanan{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.orang-kanan b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--paper)}
.orang.redup{opacity:.62}
.kartu-kunj{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px}
.kk-atas{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.kk-sales{display:inline-flex;align-items:center;gap:6px;color:var(--sky)}
.kk-judul{margin:0;font-weight:700;font-size:16px;line-height:1.3}
.kk-sub{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.kk-aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mini-btn{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--paper);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.mini-btn svg{width:16px;height:16px}
.mini-btn:active{transform:translateY(1px)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.memuat-blok{display:flex;flex-direction:column;gap:10px}
.kerangka{height:72px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0,var(--raised) 50%,var(--surface) 100%);background-size:200% 100%;animation:kilau 1.3s linear infinite}
@keyframes kilau{0%{background-position:100% 0}100%{background-position:-100% 0}}
.gagal-blok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);font-size:14px}

/* ---------- v2: sheet detail ---------- */
.info-blok{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px}
.info-blok h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.info-baris{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.info-baris span{color:var(--muted)}
.info-baris b{font-weight:600;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.foto-tampil{width:100%;aspect-ratio:1;max-height:min(70vh,420px);border-radius:16px;background:var(--ink);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px}
.foto-tampil img{width:100%;height:100%;object-fit:contain}
.kredensial{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#0A1B1E;border:2px dashed var(--sun-d)}
.kredensial div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.kredensial span{color:var(--muted)}
.kredensial b{font-family:var(--mono,ui-monospace),ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.03em;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere;text-align:right}
.aksi-daftar{display:flex;flex-direction:column;gap:10px}
.aksi-daftar .btn{justify-content:flex-start;font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:0;min-height:56px}
.btn-bahaya{--sh:#7A2410;background:transparent;color:#FF9B7A;border:2px solid #7A2410}
.btn-bahaya.siap{background:var(--coral);color:var(--ink);border-color:var(--coral)}
.pw-row{display:flex;gap:8px}
.pw-row .inp{flex:1;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.pw-row .btn{min-height:52px;padding:10px 14px;font-size:14px}
.profil{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.profil .inisial{width:76px;height:76px;border-radius:24px;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.profil-nama{margin:8px 0 0;font-family:var(--display);font-size:24px;line-height:1.1}
.profil-sub{margin:0;color:var(--muted);font-size:14px}
.thumb-btn{appearance:none;border:0;padding:0;background:none;cursor:pointer}
.tl-foto-kosong{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--raised);color:var(--muted)}
.tl-foto-kosong svg{width:20px;height:20px}
a.btn{text-decoration:none}

/* ---------- v3: tab bar 5 menu ---------- */
.tabbar{grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px calc(12px + var(--safe-bot))}
.tab{font-size:11px;padding:8px 2px 7px;border-radius:15px}
.tab svg{width:22px;height:22px}
.tab .badge{right:calc(50% - 20px)}

/* ---------- v3: pengumuman ---------- */
.umum{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px;border-color:var(--sky);background:linear-gradient(135deg,rgba(134,204,255,.14),transparent 60%),var(--surface);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.umum-ikon{width:40px;height:40px;border-radius:12px;background:var(--sky);color:var(--ink);display:grid;place-items:center}
.umum-ikon svg{width:22px;height:22px}
.umum-judul{margin:0;font-weight:700;font-size:15px;line-height:1.3}
.umum-isi{margin:4px 0 0;font-size:13.5px;color:var(--paper);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.umum-meta{margin:6px 0 0;font-size:12px;color:var(--muted)}
.icon-btn.kecil{width:36px;height:36px;border-radius:11px}
.icon-btn.kecil svg{width:16px;height:16px}
.umum-penuh{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.6;overflow-wrap:anywhere}

/* ---------- v3: kotak hoki ---------- */
.hoki{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-color:var(--sun-d);background:radial-gradient(120% 120% at 0% 0%,rgba(255,194,61,.2),transparent 60%),var(--surface)}
.hoki.redup{border-color:var(--raised);background:var(--surface);opacity:.8}
.hoki .peti{width:76px;height:64px}
.hoki-judul{margin:0;font-family:var(--display);font-size:18px;line-height:1.15}
.hoki-sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.hoki .btn{margin-top:10px;min-height:44px;padding:8px 16px;font-size:14px}
.peti{display:block;overflow:visible}
.peti .tutup{transform-box:fill-box;transform-origin:0% 100%;transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.peti.goyang{animation:goyang-peti 2.2s ease-in-out infinite}
.peti.heboh{animation:heboh-peti .32s linear infinite}
.peti.buka .tutup{transform:translateY(-10px) rotate(-24deg)}
@keyframes goyang-peti{0%,70%,100%{transform:none}75%{transform:rotate(-6deg)}82%{transform:rotate(6deg)}89%{transform:rotate(-3deg)}}
@keyframes heboh-peti{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}
.panggung-peti{position:relative;width:220px;height:200px;margin:8px auto 0;display:grid;place-items:center}
.panggung-peti .peti{width:170px;height:144px;position:relative;z-index:1}
.sinar{position:absolute;inset:-30px;border-radius:50%;background:repeating-conic-gradient(rgba(255,194,61,.32) 0 10deg,transparent 10deg 24deg);opacity:0;transform:scale(.4);transition:opacity .4s,transform .6s}
.panggung-peti.terbuka .sinar{opacity:1;transform:scale(1);animation:putar 8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.isi-peti{margin:0;font-family:var(--display);font-size:56px;line-height:1;color:var(--sun);text-shadow:0 5px 0 var(--sun-d);animation:pop .6s cubic-bezier(.2,1.7,.4,1) both}
.jackpot{margin:0;font-family:var(--display);font-size:28px;color:var(--coral);text-shadow:0 4px 0 var(--coral-d);animation:pop .6s .1s cubic-bezier(.2,1.7,.4,1) both}

/* ---------- v3: program & target ---------- */
.prog{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.prog-atas{display:flex;gap:12px;align-items:center}
.prog-ikon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--ink)}
.prog-ikon svg{width:24px;height:24px}
.prog-bonus .prog-ikon{background:var(--sun)}
.prog-tantangan .prog-ikon{background:var(--mint)}
.prog-bonus{border-color:var(--sun-d);background:linear-gradient(135deg,rgba(255,194,61,.16),transparent 55%),var(--surface)}
.prog-tantangan{border-color:var(--mint-d);background:linear-gradient(135deg,rgba(79,224,166,.14),transparent 55%),var(--surface)}
.prog-label{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prog-judul{margin:2px 0 0;font-family:var(--display);font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.prog-sub{margin:0;font-size:13px;color:var(--muted)}
.batang{height:12px;border-radius:6px;background:var(--ink);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.batang i{display:block;height:100%;border-radius:6px;background:var(--mint);transition:width .7s cubic-bezier(.25,.9,.3,1.15)}
.batang.emas i{background:linear-gradient(90deg,var(--sun),#FFE39A)}
.batang-label{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.batang-label b{font-variant-numeric:tabular-nums}
.target-blok{display:flex;flex-direction:column;gap:12px}
.target-blok .baris-target{display:flex;flex-direction:column;gap:6px}
.prog-aksi{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- v3: peringkat ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod-av{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--medal,var(--raised))}
.pod-1 .pod-av{width:72px;height:72px;font-size:30px}
.pod-mahkota{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:28px;height:28px;color:var(--sun);filter:drop-shadow(0 2px 0 var(--sun-d))}
.pod-nama{margin:0;font-weight:700;font-size:13px;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.pod-nilai{margin:0;font-family:var(--display);font-size:16px;color:var(--sun)}
.pod-base{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:start center;padding-top:8px;font-family:var(--display);font-size:26px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pod-1 .pod-base{height:96px;background:var(--sun)}
.pod-2 .pod-base{height:72px;background:#C9D6DF}
.pod-3 .pod-base{height:56px;background:#E39B5B}
.pod.saya .pod-nama{color:var(--sun)}
.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:34px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:2px solid var(--raised);border-radius:16px}
.rank.saya{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,194,61,.15)}
.rank-no{font-family:var(--display);font-size:16px;color:var(--muted);text-align:center}

class GagalApi extends Error { constructor(pesan, status, kode) { super(pesan); this.status = status; this.kode = kode; } }
async function api(rute, data = {}) {
  try { return await apiServer(rute, data); }
  catch (e) {
    if (e && e.kode === 'LOGIN') { e.ditangani = true; keLogin(e.message); }
    throw e;
  }
}
async function apiServer(rute, data) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const tm = ctrl ? setTimeout(() => ctrl.abort(), 20000) : null;
  let res;
  try {
    res = await fetch(`${API_URL}/api/${rute}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': (tg && tg.initData) || '' },
      body: JSON.stringify(data), signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    throw new GagalApi('Server nggak bisa dihubungi. Kalau lagi pakai Wi-Fi, coba ganti ke data seluler.', 0);
  } finally { if (tm) clearTimeout(tm); }
  if (rute === 'foto') {
    if (!res.ok) { let j = {}; try { j = await res.json(); } catch (e) {} throw new GagalApi(j.error || 'Foto nggak bisa dibuka', res.status, j.kode); }
    return res.blob();
  }
  let j = {};
  try { j = await res.json(); } catch (e) {}
  if (!res.ok || !j.ok) throw new GagalApi(j.error || `Server error (${res.status})`, res.status, j.kode);
  return j;
}
const pesanError = e => (e && e.message) || 'Ada yang salah. Coba lagi ya.';

/* ================= LOKASI & FOTO ================= */
function ambilLokasi(timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    let selesai = false;
    const beres = (fn, v) => { if (selesai) return; selesai = true; clearTimeout(tm); fn(v); };
    const tm = setTimeout(() => beres(reject, new Error('timeout')), timeoutMs);
    const lewatBrowser = () => {
      if (!navigator.geolocation) return beres(reject, new Error('nogeo'));
      try {
        navigator.geolocation.getCurrentPosition(
          p => beres(resolve, { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
          e => beres(reject, e), { enableHighAccuracy: true, timeout: timeoutMs - 500, maximumAge: 30000 });
      } catch (e) { beres(reject, e); }
    };
    const lm = tg && tg.LocationManager;
    if (inTG && lm && versi('8.0')) {
      try {
        lm.init(() => {
          if (!lm.isLocationAvailable) return lewatBrowser();
          lm.getLocation(d => d ? beres(resolve, { lat: d.latitude, lng: d.longitude, acc: Math.round(d.horizontal_accuracy || 0) }) : lewatBrowser());
        });
      } catch (e) { lewatBrowser(); }
    } else lewatBrowser();
  });
}
function kompres(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('foto')); };
    img.src = url;
  });
}
const fotoUrl = new Map();
async function muatFoto(id) {
  if (fotoUrl.has(id)) return fotoUrl.get(id);
  const blob = await api('foto', { id });
  const url = URL.createObjectURL(blob);
  fotoUrl.set(id, url);
  return url;
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
function confetti(power = 1) {
  if (reduced) return;
  const c = $('#confetti'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const warna = ['#FF6A3D', '#FFC23D', '#4FE0A6', '#F4EEDF', '#86CCFF'];
  const P = Array.from({ length: Math.round(110 * power) }, () => ({
    x: w / 2 + (Math.random() - .5) * 80, y: h * .42, vx: (Math.random() - .5) * 13, vy: -Math.random() * 14 - 6,
    s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: warna[Math.random() * warna.length | 0], kotak: Math.random() < .55
  }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, w, h);
    P.forEach(p => {
      p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      if (p.kotak) g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); else { g.beginPath(); g.arc(0, 0, p.s / 3, 0, 7); g.fill(); }
      g.restore();
    });
    if (t - t0 < 2200) requestAnimationFrame(frame); else g.clearRect(0, 0, w, h);
  })(t0);
}
function floatXP(n, dariEl) {
  const bar = $('#h-bar'); if (!bar || !n) return;
  const a = (dariEl && dariEl.isConnected ? dariEl : bar).getBoundingClientRect(), b = bar.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'float-xp'; s.textContent = `+${n} XP`;
  s.style.left = (a.left + a.width / 2) + 'px'; s.style.top = (a.top + a.height / 2) + 'px';
  document.body.appendChild(s);
  if (reduced || !s.animate) { setTimeout(() => s.remove(), 700); return; }
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  s.animate([
    { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
    { transform: 'translate(-50%,-110%) scale(1.15)', opacity: 1, offset: .3 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.45)`, opacity: .2 }
  ], { duration: 950, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = () => s.remove();
}
function tampilkanXP(n, g, dariEl) {
  floatXP(n, dariEl);
  setTimeout(() => {
    const bar = $('#h-bar'), fill = $('#h-fill'); if (!bar) return;
    bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump');
    if (g.after > g.before) {
      fill.style.width = '100%';
      setTimeout(() => {
        fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth; fill.style.transition = '';
        renderHUD(); antre(() => bukaLevelUp(g.after), true);
      }, 750);
    } else renderHUD();
  }, reduced ? 0 : 700);
}
function gambarKontur() {
  const c = $('#kontur'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h); g.lineWidth = 1;
  [[w * .88, h * .1, 1.3], [w * .08, h * .6, 2.1], [w * .7, h * 1.02, .7]].forEach(([cx, cy, seed]) => {
    for (let k = 1; k <= 15; k++) {
      const r = k * 26;
      g.beginPath();
      for (let i = 0; i <= 140; i++) {
        const a = i / 140 * Math.PI * 2;
        const rr = r * (1 + .1 * Math.sin(3 * a + seed + k * .15) + .06 * Math.sin(5 * a - seed * 2 + k * .1) + .03 * Math.sin(9 * a + seed));
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * .85;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.strokeStyle = k % 5 === 0 ? 'rgba(79,224,166,.11)' : 'rgba(166,192,187,.065)';
      g.stroke();
    }
  });
}

  draft = { nama: '', hp: '', alamat: '', status: '', paket: '', catatan: '' }; fotoKunjungan = null; menyimpan = false;
  rayakan(r, before, btn);
  renderKunjungan(); perbaruiBadge();
  const misiBaru = misiSiapKlaim().length > siapSebelum ? ' Ada misi yang bisa diklaim di Markas.' : '';

/* ================= SALES: RIWAYAT ================= */
function itemsHari(h) {
  const out = [];
  if (h.masuk) out.push({ t: h.masuk.t, jenis: 'masuk', d: h.masuk });
  (h.visits || []).forEach(v => out.push({ t: v.t, jenis: 'kunjungan', d: v }));
  if (h.pulang) out.push({ t: h.pulang.t, jenis: 'pulang', d: h.pulang });
  return out.sort((a, b) => a.t - b.t);
}
function fotoMini(id, bulat, alt) {
  if (!id) return '';
  const src = fotoLokal[id] || fotoUrl.get(id);
  if (src) return `<img class="tl-foto ${bulat ? 'bulat' : ''}" src="${src}" alt="${esc(alt)}">`;
  return `<button class="thumb-btn" data-act="lihat-foto" data-id="${esc(id)}" data-judul="${esc(alt)}" aria-label="Lihat ${esc(alt)}"><span class="tl-foto-kosong">${ICON.image}</span></button>`;
}
function timeline(h, kosong) {
  const items = itemsHari(h);
  if (!items.length) return `<p class="kosong">${kosong || 'Belum ada aktivitas.'}</p>`;
  return `<ol class="timeline">${items.map(it => {
    const d = it.d;
    const side = (foto, bulat, alt) => (foto || d.xp) ? `<div class="tl-side">${fotoMini(foto, bulat, alt)}${d.xp ? `<span class="xp-chip">+${d.xp}</span>` : ''}</div>` : '';
    if (it.jenis === 'kunjungan') {
      return `<li class="tl"><span class="tl-time">${jam(d.t)}</span><div class="tl-body"><div class="tl-text">
        <p class="tl-title">${esc(d.nama)} <span class="pill s-${d.status}">${STATUS[d.status].label}</span></p>
        <p class="tl-sub">${[d.alamat, d.paket].filter(Boolean).map(esc).join(' · ')}</p>
        ${d.catatan ? `<p class="tl-note">${esc(d.catatan)}</p>` : ''}</div>${side(d.foto, false, 'Foto kunjungan ' + d.nama)}</div></li>`;
    }
    return `<li class="tl tl-absen"><span class="tl-time">${jam(d.t)}</span><div class="tl-body"><div class="tl-text">
      <p class="tl-title">${it.jenis === 'masuk' ? 'Absen masuk' : 'Absen pulang'}</p>
      <p class="tl-sub">${lokasiTeks(d)}</p></div>${side(d.foto, true, 'Selfie absen ' + it.jenis)}</div></li>`;
  }).join('')}</ol>`;
}

function teksRekap() {

async function kirimProgram() {

const konfirmasi = {};
function konfirmasiDua(btn, kunci, teksSiap, teksAsli) {

  return false;
}

/* ================= ABSEN (alur 3 langkah) ================= */
function bukaAbsen(type) {
  flow = { type, step: 1, loc: null, err: null, foto: null, sending: false, done: null };
  renderFlow(); cariLokasi();
}
async function cariLokasi() {
  if (!flow) return;
  const f = flow; f.loc = null; f.err = null; renderFlow();
  try { const loc = await ambilLokasi(); if (flow !== f) return; f.loc = loc; getar.sukses(); }
  catch (e) { if (flow !== f) return; f.err = e; getar.awas(); }
  renderFlow();
}
function renderFlow() {
  const f = flow; if (!f) return;
  const masuk = f.type === 'masuk', judul = masuk ? 'Absen masuk' : 'Absen pulang';

    const t = f.done.t, r = f.done.r;
    const sub = masuk ? `${jam(t)} · Streak ${S.streak} hari` : `${jam(t)} · ${fmtDur((t - S.hariIni.masuk.t) / 60000)} di lapangan`;
    isi = `<div class="sukses">

    let msg, aksi;
    if (f.loc) {
      msg = `<p class="flow-title">Lokasi terkunci</p><p class="coords">${f.loc.lat.toFixed(5)}, ${f.loc.lng.toFixed(5)}</p><p class="flow-sub">Akurasi ±${f.loc.acc} m</p>`;

    } else if (f.err) {
      msg = `<p class="flow-title">Lokasi belum kebaca</p><p class="flow-sub">Nyalakan GPS dan izinkan Telegram pakai lokasi, lalu coba lagi.</p>`;
      aksi = '<button class="btn btn-coral btn-xl" data-act="flow-retry">Coba lagi</button>';
    } else {
      msg = '<p class="flow-title">Nyari lokasi kamu…</p><p class="flow-sub">Pastikan GPS nyala dan kamu ada di area kerja.</p>';
      aksi = '<button class="btn btn-xl" disabled>Mencari sinyal…</button>';
    }
    isi = `<div class="flow-body"><div class="radar ${f.loc ? 'dapat' : f.err ? 'gagal' : ''}"><span></span><span></span><span></span>${ICON.pin}</div>${msg}</div><div class="flow-actions">${aksi}</div>`;
  } else if (f.step === 2) {
    isi = `<div class="flow-body">
        <label for="pick-selfie" class="selfie ${f.foto ? 'ada' : ''}">${f.foto ? `<img src="${f.foto}" alt="Selfie kamu">` : `${ICON.camera}<span>Ketuk buat selfie</span>`}</label>
        <p class="flow-title">${f.foto ? 'Selfie siap' : 'Selfie dulu'}</p>
        <p class="flow-sub">Wajah kelihatan jelas, dengan latar tempat kamu ${masuk ? 'mulai' : 'selesai'} kerja.</p>
      </div>
      <div class="flow-actions">${f.foto
        ? `<button class="btn btn-coral btn-xl" data-act="flow-next">Lanjut</button><label for="pick-selfie" class="btn btn-ghost">${ICON.camera}Foto ulang</label>`
        : `<label for="pick-selfie" class="btn btn-coral btn-xl">${ICON.camera}Ambil selfie</label>`}</div>`;
  } else {
    const now = Date.now(), items = hadiahAbsen(f.type, now), mnt = minutesOf(now), kx = kaliBonus('absen');
    if (kx > 1) items.push(['Bonus program', Math.round(total(items) * (kx - 1))]);
    const status = masuk ? (mnt <= SHIFT_MULAI ? 'Tepat waktu' : `Telat ${fmtDur(mnt - SHIFT_MULAI)}`)
      : (mnt >= SHIFT_SELESAI ? 'Full shift' : `${fmtDur(SHIFT_SELESAI - mnt)} lebih awal`);
    isi = `<div class="flow-body">
        <div class="card ringkas"><img src="${f.foto}" alt="Selfie kamu"><dl>
          <div><dt>Jam</dt><dd>${jam(now)}</dd></div>
          <div><dt>Lokasi</dt><dd>${f.loc.lat.toFixed(4)}, ${f.loc.lng.toFixed(4)}</dd></div>
          <div><dt>Status</dt><dd>${status}</dd></div>
        </dl></div>
        <ul class="hadiah">${items.map(([n, x]) => `<li><span>${n}</span><b>+${x}</b></li>`).join('')}<li class="total"><span>Total</span><b>+${total(items)} XP</b></li></ul>
      </div>
      <div class="flow-actions"><button class="btn btn-coral btn-xl" data-act="flow-kirim">${ICON.send}Kirim absen</button><button class="btn btn-ghost" data-act="flow-back">Ganti selfie</button></div>`;
  }

  const sudahBuka = sheetMode === 'absen';
  const html = `<div class="sheet-panel full ${sudahBuka ? 'diam' : ''}"><div class="sheet-head"><h2 id="sheet-title" tabindex="-1">${judul}</h2><button class="icon-btn" data-act="tutup" aria-label="Tutup">${ICON.x}</button></div>${steps}${isi}</div>`;
  if (sudahBuka) $('#sheet').innerHTML = html; else bukaSheet('absen', html);
}

/* ================= EVENT ================= */
function pasangEvent() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case 'boot': boot(); break;
      case 'tab': setTab(el.dataset.tab); break;
      case 'mata': {
        const inp = $('#' + el.dataset.untuk); if (!inp) break;
        const lihat = inp.type === 'password'; inp.type = lihat ? 'text' : 'password';
        el.innerHTML = lihat ? ICON.eyeOff : ICON.eye; el.setAttribute('aria-label', lihat ? 'Sembunyikan password' : 'Tampilkan password');
        break;
      }
      case 'profil': getar.ketuk(); bukaProfil(); break;
      case 'logout': logout(el); break;
      case 'muat-ulang': getar.ketuk(); PANTAU = null; TIM = null; LAP.data = null; LAP.galat = null; PER.data = null; PROG = null; HAD_ADMIN = null; UMUM = null; renderTab(); break;
      case 'muat-laporan': muatLaporan(); break;
      case 'muat-tim': TIM = null; renderTim(); break;
      case 'muat-peringkat': muatPeringkat(); break;
      case 'muat-hadiah': HAD = null; renderHadiah(); break;
      case 'muat-program': PROG = null; renderKelola(); break;
      case 'muat-hadiah-admin': HAD_ADMIN = null; renderKelola(); break;
      case 'muat-umum': UMUM = null; renderKelola(); break;
      case 'absen': getar.ketuk(); bukaAbsen(el.dataset.type); break;
      case 'klaim': klaim(el.dataset.id, el); break;
      case 'buka-kotak': getar.ketuk(); bukaKotakSheet(); break;
      case 'kotak-buka': bukaKotakSekarang(el); break;
      case 'buka-umum': if (!e.target.closest('[data-act="tutup-umum"]')) { getar.ketuk(); bukaPengumuman(el.dataset.id); } break;
      case 'tutup-umum': e.stopPropagation(); getar.ketuk(); tandaiBaca(el.dataset.id); break;
      case 'oke-umum': tutupSheet(); tandaiBaca(el.dataset.id); break;
      case 'tutup': tutupSheet(); break;
      case 'flow-next': getar.ketuk(); flow.step++; renderFlow(); break;

  let terakhirAktif = Date.now();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !AKUN) return;
    if (Date.now() - terakhirAktif < 60000) return;
    terakhirAktif = Date.now();
    if (isAdmin()) { PANTAU = null; HAD_ADMIN = null; if (['pantau', 'kelola'].includes(tabAktif)) renderTab(); return; }
    if (!$('#sheet').hidden) return;
    try { const r = await api('sesi'); if (r.status === 'ok') { terimaData(r); renderSemua(); } else terimaSesi(r); } catch (e) {}
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(gambarKontur, 150); });
}

/* ================= MULAI ================= */
siapkanTelegram();
gambarKontur(); pasangEvent();
boot();
})();
</script>
