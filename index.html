<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E2428">
<title>Sales Quest</title>
<!-- SDK Telegram Mini App. Di luar Telegram script ini boleh gagal dimuat: app tetap jalan dalam mode pratinjau. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Arah: HUD game di atas peta kontur lapangan. Teal gelap, tombol tebal 3D, koral buat aksi, emas buat XP. */
  --ink:#0E2428;
  --surface:#15353B;
  --raised:#1F474E;
  --line:#2D5C63;
  --paper:#F4EEDF;
  --muted:#A6C0BB;
  --coral:#FF6A3D; --coral-d:#B63F1A;
  --sun:#FFC23D;   --sun-d:#B5830C;
  --mint:#4FE0A6;  --mint-d:#1E976A;
  --sky:#86CCFF;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --safe-top:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  --safe-bot:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea,.bubble{-webkit-user-select:text;user-select:text}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#kontur,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#kontur{z-index:0}
#confetti{z-index:60}
#app{position:relative;z-index:1;height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- HUD ---------- */
.hud{padding:calc(var(--safe-top) + 12px) 16px 10px}
.hud-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.avatar{position:relative;width:54px;height:54px;border-radius:17px;background:var(--coral);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;box-shadow:0 4px 0 var(--coral-d)}
.avatar .lv{position:absolute;right:-9px;bottom:-9px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:400;font-size:13px;display:grid;place-items:center;border:3px solid var(--ink)}
.who{min-width:0}
.name{margin:0;font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.gelar{margin:1px 0 0;font-size:12px;font-weight:600;color:var(--sun)}
.xpbar{margin-top:7px;height:12px;border-radius:6px;background:var(--surface);box-shadow:inset 0 2px 0 rgba(0,0,0,.3);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--sun),#FFE39A);transition:width .7s cubic-bezier(.25,.9,.3,1.15)}
.xpbar.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scaleY(1.6)}}
.xptext{margin:4px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.xptext b{font-family:var(--display);font-weight:400;color:var(--paper);margin-right:8px}
.streak-pill{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 10px;border-radius:15px;background:var(--surface);border:2px solid var(--raised)}
.streak-pill svg{width:22px;height:22px;color:var(--coral)}
.streak-pill b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1}
.streak-pill.mati svg{color:var(--muted);opacity:.7}

main{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 16px 28px}
.view{display:flex;flex-direction:column;gap:16px;animation:muncul .35s ease both}
@keyframes muncul{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}

.greet .date{margin:0;font-size:13px;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;text-wrap:balance}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h1{margin:0}
.sec{margin:8px 0 -4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.tag{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}

.card{background:var(--surface);border:2px solid var(--raised);border-radius:20px;padding:16px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--raised);color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.s-closing{background:var(--sun);color:var(--ink)}
.s-tertarik{background:var(--mint);color:var(--ink)}
.s-pikir{background:var(--sky);color:var(--ink)}
.s-tidak,.s-belum{background:var(--raised);color:var(--muted)}
.s-warn{background:rgba(255,106,61,.18);color:#FF9B7A}

.note{margin:0;display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:13px;color:var(--muted);padding:10px 12px;border:1.5px dashed var(--line);border-radius:14px}
.note svg{flex:none;width:18px;height:18px;color:var(--sky);margin-top:1px}

/* ---------- Tombol ---------- */
.btn{--sh:#BDB4A1;appearance:none;border:0;margin:0;font:inherit;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em;color:var(--ink);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 var(--sh);cursor:pointer;text-align:center;transition:transform .08s ease,box-shadow .08s ease,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}
.btn svg{width:22px;height:22px;flex:none}
.btn-coral{--sh:var(--coral-d);background:var(--coral)}
.btn-mint{--sh:var(--mint-d);background:var(--mint)}
.btn-sun{--sh:var(--sun-d);background:var(--sun)}
.btn-ghost{--sh:transparent;background:transparent;color:var(--paper);border:2px solid var(--line);font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:0}
.btn-ghost:active{transform:translateY(2px)}
.btn-xl{width:100%;min-height:62px;font-size:18px}
.btn[disabled]{filter:saturate(.3) brightness(.75);cursor:default;pointer-events:none}
.reward{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:0;padding:4px 9px;border-radius:999px;background:rgba(14,36,40,.16)}
.link-btn{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:10px;align-self:center;cursor:pointer}
.icon-btn{appearance:none;flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--raised);background:var(--surface);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}

/* ---------- Kartu absen ---------- */
.absen-card{display:flex;flex-direction:column;gap:14px;padding:18px;background:radial-gradient(130% 100% at 100% 0%,rgba(255,106,61,.22),transparent 60%),var(--surface)}
.absen-card.on{background:radial-gradient(130% 100% at 100% 0%,rgba(79,224,166,.18),transparent 60%),var(--surface)}
.absen-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.absen-headline{margin:0;font-family:var(--display);font-size:clamp(24px,7.5vw,32px);line-height:1.08;text-wrap:balance}
.absen-sub{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.absen-sub.flat,.absen-row .absen-sub{margin:0}
.absen-row{display:flex;gap:14px;align-items:center}
.thumb{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--mint);flex:none;background:var(--raised)}
.thumb-kosong{display:grid;place-items:center;color:var(--muted)}
.thumb-kosong svg{width:26px;height:26px}
.absen-time{margin:0;font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--ink);border-radius:14px;padding:10px 12px}
.duo span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.duo b{font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.gold{color:var(--sun)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.gold b{color:var(--sun)}

/* ---------- Misi ---------- */
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.quest{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:2px solid var(--raised);border-radius:18px}
.q-ico{width:44px;height:44px;border-radius:13px;background:var(--raised);color:var(--sun);display:grid;place-items:center}
.q-ico svg{width:24px;height:24px}
.q-title{margin:0;font-weight:600;font-size:15px;line-height:1.25}
.q-bar{margin-top:7px;height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.q-bar i{display:block;height:100%;border-radius:4px;background:var(--mint);transition:width .6s ease}
.q-meta{margin:4px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-reward{font-family:var(--display);font-size:14px;color:var(--sun);white-space:nowrap}
.q-ok{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--ink);display:grid;place-items:center}
.q-ok svg{width:20px;height:20px}
.quest.done{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,194,61,.15)}
.quest.done .q-ico{background:var(--sun);color:var(--ink)}
.quest.claimed .q-title{color:var(--muted)}
.quest.gagal{border-style:dashed;border-color:var(--line)}
.quest.gagal .q-ico{color:var(--muted)}
.quest.gagal .q-reward{color:var(--muted);text-decoration:line-through}
.btn-claim{min-height:42px;padding:8px 12px;font-size:13px;border-radius:13px;box-shadow:0 4px 0 var(--sh);animation:goyang 2.4s ease-in-out infinite}
.btn-claim:active{box-shadow:0 1px 0 var(--sh);animation:none}
@keyframes goyang{0%,80%,100%{transform:none}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}

/* ---------- Streak ---------- */
.streak-card{display:flex;flex-direction:column;gap:14px}
.streak-card>p{margin:0;font-size:14px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.day.now{color:var(--sun)}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--ink);border:2px solid var(--raised);display:grid;place-items:center;color:var(--ink)}
.dot svg{width:58%;height:58%}
.dot.on{background:var(--coral);border-color:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.dot.today{border:2px dashed var(--sun)}
.dot.today.on{border-style:solid;border-color:var(--coral)}

/* ---------- Form kunjungan ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend,.label{font-size:13px;font-weight:600;color:var(--muted)}
.field>legend{padding:0;margin-bottom:7px}
.label small,.field>legend small{font-weight:500;opacity:.85}
.inp{font:inherit;font-size:16px;color:var(--paper);background:var(--surface);border:2px solid var(--raised);border-radius:14px;padding:13px 14px;width:100%;outline:none;transition:border-color .15s}
.inp::placeholder{color:#6F8D89}
.inp:focus{border-color:var(--sun)}
textarea.inp{resize:vertical;min-height:84px}
.inp[aria-invalid="true"]{border-color:var(--coral)}
.err{margin:0;font-size:13px;color:#FF9B7A;font-weight:600}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:14px;border:2px solid var(--raised);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--raised);transition:transform .08s,box-shadow .08s,background .15s}
.choice span em{font-style:normal;font-size:12px;font-weight:800;opacity:.75}
.choice:active span{transform:translateY(2px);box-shadow:0 1px 0 var(--raised)}
.choice input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.choice input:checked+span{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 3px 0 #BDB4A1}
.choice[data-s="closing"] input:checked+span{background:var(--sun);border-color:var(--sun);box-shadow:0 3px 0 var(--sun-d)}
.choice[data-s="tertarik"] input:checked+span{background:var(--mint);border-color:var(--mint);box-shadow:0 3px 0 var(--mint-d)}
.choice[data-s="pikir"] input:checked+span{background:var(--sky);border-color:var(--sky);box-shadow:0 3px 0 #4B8FC4}
.choice[data-s="tidak"] input:checked+span{background:var(--raised);color:var(--paper);border-color:var(--line);box-shadow:0 3px 0 #0A1A1D}
.foto-row{display:flex;gap:12px;align-items:center}
.foto-prev{width:64px;height:64px;border-radius:14px;object-fit:cover;border:2px solid var(--mint);flex:none}

.kunci{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px}
.kunci-ico{width:76px;height:76px;border-radius:24px;background:var(--raised);color:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #0A1A1D;margin-bottom:6px}
.kunci-ico svg{width:38px;height:38px}
.kunci-title{margin:0;font-family:var(--display);font-size:22px}
.kunci-sub{margin:0 0 8px;color:var(--muted);font-size:14px;max-width:32ch}

/* ---------- Riwayat ---------- */
.rekap-card{display:flex;flex-direction:column;gap:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.timeline::before{content:"";position:absolute;left:23px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px)}
.tl{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:6px 0;align-items:start}
.tl-time{position:relative;z-index:1;justify-self:center;margin-top:10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--paper);border:2px solid var(--raised);border-radius:10px;padding:3px 5px}
.tl-absen .tl-time{border-color:var(--mint);color:var(--mint)}
.tl-body{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:10px 12px;min-width:0}
.tl-text{flex:1;min-width:0}
.tl-title{margin:0;font-weight:600;font-size:15px;line-height:1.35}
.tl-sub{margin:3px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tl-note{margin:6px 0 0;font-size:13px;opacity:.88;border-left:3px solid var(--line);padding-left:8px}
.tl-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.tl-foto{width:44px;height:44px;border-radius:12px;object-fit:cover}
.tl-foto.bulat{border-radius:50%}
.xp-chip{font-family:var(--display);font-size:12px;color:var(--sun);white-space:nowrap}
.kosong{margin:0;color:var(--muted);font-size:14px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}

/* ---------- Tab bawah ---------- */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px calc(12px + var(--safe-bot));background:linear-gradient(to bottom,rgba(14,36,40,0),var(--ink) 35%)}
.tab{position:relative;appearance:none;margin:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:2px solid var(--raised);border-radius:16px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 4px 0 #0A1A1D;transition:transform .08s,box-shadow .08s}
.tab svg{width:24px;height:24px}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #0A1A1D}
.tab[aria-current="page"]{background:var(--paper);border-color:var(--paper);color:var(--ink);box-shadow:0 4px 0 #BDB4A1}
.tab .badge{position:absolute;top:6px;right:calc(50% - 22px);width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--surface)}
.tab[aria-current="page"] .badge{border-color:var(--paper)}

/* ---------- Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,16,18,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-panel{width:100%;max-width:560px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--ink);border:2px solid var(--raised);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + var(--safe-bot));display:flex;flex-direction:column;gap:16px;animation:naik .32s cubic-bezier(.2,.9,.3,1) both}
.sheet-panel.full{min-height:100%;border-radius:0;border:0;padding-top:calc(var(--safe-top) + 14px)}
.sheet-panel.diam{animation:none}
@keyframes naik{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
h2[tabindex]:focus{outline:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.step i{height:6px;border-radius:3px;background:var(--raised)}
.step.on{color:var(--paper)}
.step.on i{background:var(--coral)}
.step.lewat i{background:var(--mint)}
.flow-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;animation:muncul .3s ease both}
.flow-title{margin:0;font-family:var(--display);font-size:22px;line-height:1.15}
.flow-sub{margin:0;color:var(--muted);font-size:14px}
.coords{margin:0;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;letter-spacing:.02em}
.flow-actions{display:flex;flex-direction:column;gap:12px}

.radar{position:relative;width:min(220px,60vw);aspect-ratio:1;margin:0 auto 6px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--raised);background:radial-gradient(circle,rgba(79,224,166,.10) 0 30%,transparent 31%),repeating-radial-gradient(circle,transparent 0 26px,rgba(166,192,187,.12) 26px 28px)}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(166,192,187,.12)}
.radar::before{left:50%;top:8%;bottom:8%;width:2px;transform:translateX(-50%)}
.radar::after{top:50%;left:8%;right:8%;height:2px;transform:translateY(-50%)}
.radar span{position:absolute;inset:0;border-radius:50%;border:3px solid var(--mint);opacity:0;animation:ping 2.4s ease-out infinite}
.radar span:nth-child(2){animation-delay:.8s}
.radar span:nth-child(3){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.radar .pin{position:relative;z-index:1;width:64px;height:64px;color:var(--coral);filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:lompat 1.1s ease-in-out infinite}
@keyframes lompat{50%{transform:translateY(-10px)}}

<script>
(() => {
'use strict';

/* ================= PENGATURAN ================= */
const API_URL = 'https://salesaccess.dffaseptember.workers.dev'; // Server bot (Cloudflare Worker)
const SHIFT_MULAI = 8 * 60;     // 08.00
const SHIFT_SELESAI = 17 * 60;  // 17.00
const TARGET_KUNJUNGAN = 5;
const STORE_KEY = 'salesquest-demo-v1';
const LOKASI_CONTOH = { lat: -6.91475, lng: 107.60981, acc: 15, demo: true };

const tg = (window.Telegram && window.Telegram.WebApp) || null;
const inTG = !!(tg && tg.initData);
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

const ICON = {
  flame: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.6 2.2c.5 3.1 4.9 5.4 4.9 10.3a5.5 5.5 0 0 1-11 0c0-2.7 1.4-4.5 2.9-5.6-.1 2 .7 3.4 2 3.9-.3-3.2.2-6 1.2-8.6z"/></svg>',
  pin: '<svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22s7.5-6.4 7.5-12.5a7.5 7.5 0 0 0-15 0C4.5 15.6 12 22 12 22zm0-9.3a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.8-2.5h6.4L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  door: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4h12v17"/><path d="M3.5 21h17"/><circle cx="14.5" cy="12.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3.5M8.5 20.5h7M9.5 17.5h5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.8 11.3L21 3.5l-4.4 17.2-5.1-5.6-3.3 3v-4.6L17 6.6l-10.6 6.6z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/></svg>'
};

/* ================= TELEGRAM ================= */
const versi = v => { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } };
function siapkanTelegram() {
  if (!tg) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  if (!inTG) return;
  try { if (versi('8.0') && ['android', 'ios'].includes(tg.platform)) tg.requestFullscreen(); } catch (e) {}
  try { if (versi('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  try { if (versi('6.1')) { tg.setHeaderColor('#0E2428'); tg.setBackgroundColor('#0E2428'); } } catch (e) {}
  try { if (versi('7.10')) tg.setBottomBarColor('#0E2428'); } catch (e) {}
  try { if (versi('6.1')) tg.BackButton.onClick(() => tutupSheet()); } catch (e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const getar = {
  ketuk()  { try { inTG ? tg.HapticFeedback.impactOccurred('light') : vib(8); } catch (e) {} },
  mantap() { try { inTG ? tg.HapticFeedback.impactOccurred('heavy') : vib(22); } catch (e) {} },
  sukses() { try { inTG ? tg.HapticFeedback.notificationOccurred('success') : vib([12, 60, 18]); } catch (e) {} },
  awas()   { try { inTG ? tg.HapticFeedback.notificationOccurred('warning') : vib([30, 40, 30]); } catch (e) {} },
  pilih()  { try { if (inTG) tg.HapticFeedback.selectionChanged(); } catch (e) {} }
};
const namaUser = () => {
  try { const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (u && u.first_name) return u.first_name; } catch (e) {}
  return 'Dap';
};

/* ================= WAKTU ================= */
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dayKey(new Date());
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const jam = t => { const d = new Date(t); return `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const minutesOf = t => { const d = new Date(t); return d.getHours() * 60 + d.getMinutes(); };
const menitSekarang = () => minutesOf(Date.now());
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const HARI3 = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const tanggal = d => `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
const tanggalPendek = d => `${d.getDate()} ${BULAN[d.getMonth()]}`;
const fmtDur = min => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} j ${m} mnt` : `${m} mnt`; };
const salam = h => h < 11 ? 'Pagi' : h < 15 ? 'Siang' : h < 18 ? 'Sore' : 'Malam';

/* ================= GAME ================= */
const need = l => 100 + 50 * (l - 1);
function levelInfo(xp) { let l = 1, sisa = xp; while (sisa >= need(l)) { sisa -= need(l); l++; } return { level: l, cur: sisa, need: need(l) }; }
const GELAR = ['Anak Baru', 'Pejalan Gang', 'Penjelajah Komplek', 'Penakluk Perumahan', 'Raja Ruko', 'Legenda Lapangan'];
const gelar = l => GELAR[Math.min(l, GELAR.length) - 1];
const STATUS = {
  closing:  { label: 'Closing', xp: 100 },
  tertarik: { label: 'Tertarik', xp: 10 },
  pikir:    { label: 'Pikir-pikir', xp: 0 },
  tidak:    { label: 'Nggak tertarik', xp: 0 }
};
const PAKET = ['30 Mbps', '50 Mbps', '100 Mbps', 'Lainnya'];
const total = items => items.reduce((a, b) => a + b[1], 0);
function hadiahAbsen(type, t) {
  const m = minutesOf(t);
  if (type === 'masuk') return [['Absen masuk', 50]].concat(m <= SHIFT_MULAI ? [['Bonus tepat waktu', 20]] : []);
  return [['Absen pulang', 30]].concat(m >= SHIFT_SELESAI ? [['Bonus full shift', 20]] : []);
}
function hadiahKunjungan(status, adaFoto) {
  const it = [['Kunjungan', 15]];
  if (status && STATUS[status].xp) it.push([STATUS[status].label, STATUS[status].xp]);
  if (adaFoto) it.push(['Foto', 5]);
  return it;
}

/* ================= DATA ================= */
function contohKemarin() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  const at = (h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x.getTime(); };
  const L = (a, b) => ({ lat: -6.9 - a / 1e4, lng: 107.6 + b / 1e4, acc: 8 + (a % 9), demo: true });
  return {
    day: dayKey(d), contoh: true,
    absen: { masuk: Object.assign({ t: at(7, 48), xp: 70 }, L(147, 98)), pulang: Object.assign({ t: at(17, 6), xp: 50 }, L(152, 91)) },
    visits: [
      Object.assign({ id: 'c1', t: at(9, 12), nama: 'Bu Ratna', alamat: 'Perum Griya Asri Blok C2 No. 7', status: 'tertarik', paket: '50 Mbps', catatan: 'Minta dihubungi lagi Sabtu, suaminya yang mutusin.', xp: 25 }, L(160, 112)),
      Object.assign({ id: 'c2', t: at(10, 40), nama: 'Warung Kopi Pak Dadang', alamat: 'Jl. Melati No. 12', status: 'closing', paket: '100 Mbps', catatan: 'Buat internet pelanggan warung. Jadwal pasang minggu ini.', xp: 115 }, L(171, 130)),
      Object.assign({ id: 'c3', t: at(13, 5), nama: 'Mas Yoga', alamat: 'Kos Putra Barokah, kamar 3', status: 'pikir', paket: '30 Mbps', catatan: 'Mau patungan sama teman sekos.', xp: 15 }, L(166, 141)),
      Object.assign({ id: 'c4', t: at(14, 30), nama: 'Ibu Siti', alamat: 'Gg. Kenanga RT 04/02', status: 'tidak', paket: '30 Mbps', catatan: 'Masih kontrak sama provider lain sampai Maret.', xp: 15 }, L(158, 150)),
      Object.assign({ id: 'c5', t: at(15, 50), nama: 'Pak Hendra', alamat: 'Ruko Sentosa No. 3', status: 'tertarik', paket: '100 Mbps', catatan: 'Buat kantor kecil, minta brosur dan simulasi biaya.', xp: 25 }, L(149, 120))
    ]
  };
}
function stateBaru() {
  return { v: 1, xp: 370, xpToday: 0, streak: 4, lastAbsenDay: yesterdayKey(), day: todayKey(), absen: { masuk: null, pulang: null }, visits: [], claimed: {}, history: [contohKemarin()] };
}
function muat(saved) {
  let s = saved && saved.v === 1 ? saved : null;
  if (!s) { try { const raw = localStorage.getItem(STORE_KEY); if (raw) s = JSON.parse(raw); } catch (e) {} }
  if (!s || s.v !== 1) s = stateBaru();
  if (s.day !== todayKey()) {
    if (s.absen.masuk || s.visits.length) s.history.unshift({ day: s.day, absen: s.absen, visits: s.visits });
    s.history = s.history.slice(0, 7);
    s.day = todayKey(); s.absen = { masuk: null, pulang: null }; s.visits = []; s.claimed = {}; s.xpToday = 0;
  }
  return s;
}
function simpan() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* penyimpanan nggak tersedia: lanjut tanpa simpan */ } }
function grantXP(n) { const before = levelInfo(S.xp).level; S.xp += n; S.xpToday = (S.xpToday || 0) + n; simpan(); return { before, after: levelInfo(S.xp).level }; }
function streakTampil() { return (S.lastAbsenDay === todayKey() || S.lastAbsenDay === yesterdayKey()) ? S.streak : 0; }
function updateStreak() { const t = todayKey(); if (S.lastAbsenDay === t) return; S.streak = S.lastAbsenDay === yesterdayKey() ? S.streak + 1 : 1; S.lastAbsenDay = t; }
function hitung(visits) { const c = { closing: 0, tertarik: 0, pikir: 0, tidak: 0 }; visits.forEach(v => { c[v.status]++; }); return c; }

function daftarMisi() {
  const m = S.absen.masuk;
  const tepat = m ? minutesOf(m.t) <= SHIFT_MULAI : false;
  const closing = S.visits.filter(v => v.status === 'closing').length;
  return [
    { id: 'tepat', icon: ICON.clock, judul: 'Absen sebelum 08.00', reward: 40, cur: tepat ? 1 : 0, max: 1, gagal: m ? !tepat : menitSekarang() > SHIFT_MULAI },
    { id: 'kunjungan', icon: ICON.door, judul: `Kunjungi ${TARGET_KUNJUNGAN} calon pelanggan`, reward: 60, cur: Math.min(S.visits.length, TARGET_KUNJUNGAN), max: TARGET_KUNJUNGAN },
    { id: 'closing', icon: ICON.trophy, judul: 'Dapat 1 closing', reward: 100, cur: Math.min(closing, 1), max: 1 },
    { id: 'pulang', icon: ICON.home, judul: 'Absen pulang', reward: 30, cur: S.absen.pulang ? 1 : 0, max: 1 }
  ];
}
const misiSiapKlaim = () => daftarMisi().filter(q => q.cur >= q.max && !S.claimed[q.id]);

/* ================= LOKASI, FOTO, KIRIM ================= */
function ambilLokasi(timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    let selesai = false;
    const beres = (fn, v) => { if (selesai) return; selesai = true; clearTimeout(tm); fn(v); };
    const tm = setTimeout(() => beres(reject, new Error('timeout')), timeoutMs);
    const lewatBrowser = () => {
      if (!navigator.geolocation) return beres(reject, new Error('nogeo'));
      try {
        navigator.geolocation.getCurrentPosition(
          p => beres(resolve, { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
          e => beres(reject, e), { enableHighAccuracy: true, timeout: timeoutMs - 500, maximumAge: 30000 });
      } catch (e) { beres(reject, e); }
    };
    const lm = tg && tg.LocationManager;
    if (inTG && lm && versi('8.0')) {
      try {
        lm.init(() => {
          if (!lm.isLocationAvailable) return lewatBrowser();
          lm.getLocation(d => d ? beres(resolve, { lat: d.latitude, lng: d.longitude, acc: Math.round(d.horizontal_accuracy || 0) }) : lewatBrowser());
        });
      } catch (e) { lewatBrowser(); }
    } else lewatBrowser();
  });
}
function kompres(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('foto')); };
    img.src = url;
  });
}
// Kirim data ke backend bot. Backend wajib cek X-Telegram-Init-Data pakai token bot sebelum percaya datanya.
async function kirim(jenis, data) {
  if (!API_URL) { await wait(550); return { demo: true }; }
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': (tg && tg.initData) || '' },

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

function confetti(power = 1) {
  if (reduced) return;
  const c = $('#confetti'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const warna = ['#FF6A3D', '#FFC23D', '#4FE0A6', '#F4EEDF', '#86CCFF'];
  const P = Array.from({ length: Math.round(110 * power) }, () => ({
    x: w / 2 + (Math.random() - .5) * 80, y: h * .42, vx: (Math.random() - .5) * 13, vy: -Math.random() * 14 - 6,
    s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: warna[Math.random() * warna.length | 0], kotak: Math.random() < .55
  }));
  const t0 = performance.now();
  (function frame(t) {
    g.clearRect(0, 0, w, h);
    P.forEach(p => {
      p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c;
      if (p.kotak) g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); else { g.beginPath(); g.arc(0, 0, p.s / 3, 0, 7); g.fill(); }
      g.restore();
    });
    if (t - t0 < 2200) requestAnimationFrame(frame); else g.clearRect(0, 0, w, h);
  })(t0);
}

function floatXP(n, dariEl) {
  const bar = $('#h-bar'); if (!bar) return;
  const a = (dariEl && dariEl.isConnected ? dariEl : bar).getBoundingClientRect(), b = bar.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'float-xp'; s.textContent = `+${n} XP`;
  s.style.left = (a.left + a.width / 2) + 'px'; s.style.top = (a.top + a.height / 2) + 'px';
  document.body.appendChild(s);
  if (reduced || !s.animate) { setTimeout(() => s.remove(), 700); return; }
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  s.animate([
    { transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 },
    { transform: 'translate(-50%,-110%) scale(1.15)', opacity: 1, offset: .3 },
    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.45)`, opacity: .2 }
  ], { duration: 950, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = () => s.remove();
}
function tampilkanXP(n, g, dariEl) {
  floatXP(n, dariEl);
  setTimeout(() => {
    const bar = $('#h-bar'), fill = $('#h-fill');
    bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump');
    if (g.after > g.before) {
      fill.style.width = '100%';
      setTimeout(() => {
        fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth; fill.style.transition = '';
        renderHUD(); bukaLevelUp(g.after);
      }, 750);
    } else renderHUD();
  }, reduced ? 0 : 700);
}

function gambarKontur() {
  const c = $('#kontur'), dpr = Math.min(2, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h); g.lineWidth = 1;
  [[w * .88, h * .1, 1.3], [w * .08, h * .6, 2.1], [w * .7, h * 1.02, .7]].forEach(([cx, cy, seed]) => {
    for (let k = 1; k <= 15; k++) {
      const r = k * 26;
      g.beginPath();
      for (let i = 0; i <= 140; i++) {
        const a = i / 140 * Math.PI * 2;
        const rr = r * (1 + .1 * Math.sin(3 * a + seed + k * .15) + .06 * Math.sin(5 * a - seed * 2 + k * .1) + .03 * Math.sin(9 * a + seed));
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * .85;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.strokeStyle = k % 5 === 0 ? 'rgba(79,224,166,.11)' : 'rgba(166,192,187,.065)';
      g.stroke();
    }
  });
}

  if (h.absen && h.absen.pulang) out.push({ t: h.absen.pulang.t, jenis: 'pulang', d: h.absen.pulang });

    <h2 class="sec">Hari ini</h2>
    ${timeline({ absen: S.absen, visits: S.visits })}
    ${S.history.map(h => `<h2 class="sec">${labelHari(h.day)}${h.contoh ? ' <span class="tag">Contoh</span>' : ''}</h2>${timeline(h)}`).join('')}
    ${API_URL ? '' : '<button class="link-btn" data-act="reset">Reset data demo</button>'}`;
}
function teksRekap() {
  const m = S.absen.masuk, p = S.absen.pulang, c = hitung(S.visits);
  const masuk = m ? `${jam(m.t)} (${minutesOf(m.t) <= SHIFT_MULAI ? 'tepat waktu' : 'telat ' + fmtDur(minutesOf(m.t) - SHIFT_MULAI)})` : 'belum absen';
  let s = `📋 REKAP HARIAN\n${tanggal(new Date())}\nSales: ${namaUser()}\n\n`;
  s += `🕗 Masuk: ${masuk}\n🏠 Pulang: ${p ? jam(p.t) : 'belum'}\n`;
  s += `🚪 Kunjungan: ${S.visits.length}\n    Closing ${c.closing} · Tertarik ${c.tertarik} · Pikir-pikir ${c.pikir} · Nggak tertarik ${c.tidak}\n`;
  if (S.visits.length) s += '\nDetail:\n' + S.visits.map((v, i) => `${i + 1}. ${jam(v.t)} ${v.nama} · ${STATUS[v.status].label}${v.paket ? ` (${v.paket})` : ''}`).join('\n') + '\n';
  s += `\n⭐ XP hari ini: +${S.xpToday || 0}`;
  return s;
}

/* ================= SHEET ================= */
let sheetMode = null, flow = null;
function bukaSheet(mode, html) {
  sheetMode = mode;
  const s = $('#sheet'); s.innerHTML = html; s.hidden = false;
  try { if (inTG && versi('6.1')) tg.BackButton.show(); } catch (e) {}
  requestAnimationFrame(() => { const h = s.querySelector('h2[tabindex]'); if (h) h.focus({ preventScroll: true }); });
}
function tutupSheet() {
  const s = $('#sheet'); if (s.hidden) return;
  s.hidden = true; s.innerHTML = '';
  try { if (inTG && versi('6.1')) tg.BackButton.hide(); } catch (e) {}
  const mode = sheetMode; sheetMode = null;
  if (mode === 'absen') {
    const f = flow; flow = null;
    if (f && f.done) { renderSemua(); tampilkanXP(f.done.xp, f.gain, $('.absen-card') || $('#v-kunjungan h1')); }
  }
}
function bukaAbsen(type) {
  flow = { type, step: 1, loc: null, err: null, foto: null, sending: false, done: null };
  renderFlow(); cariLokasi();
}
async function cariLokasi() {
  if (!flow) return;
  const f = flow; f.loc = null; f.err = null; renderFlow();
  try { const loc = await ambilLokasi(); if (flow !== f) return; f.loc = loc; getar.sukses(); }
  catch (e) { if (flow !== f) return; f.err = e; getar.awas(); }
  renderFlow();
}
function renderFlow() {
  const f = flow; if (!f) return;
  const masuk = f.type === 'masuk', judul = masuk ? 'Absen masuk' : 'Absen pulang';
  let isi = '';
  if (f.done) {
    const t = f.done.t;
    const sub = masuk ? `${jam(t)} · Streak ${streakTampil()} hari` : `${jam(t)} · ${fmtDur((t - S.absen.masuk.t) / 60000)} di lapangan`;
    isi = `<div class="sukses">
        <div class="ring">${ICON.check}</div>
        <p class="sukses-title">${judul} tercatat</p>
        <p class="big-xp">+${f.done.xp} XP</p>
        <p class="flow-sub">${sub}</p>
        ${API_URL ? '<p class="flow-sub">Laporan sudah masuk ke bot.</p>' : `<p class="note">${ICON.info}<span>Mode demo: data baru disimpan di HP ini, belum dikirim ke bot.</span></p>`}
      </div>
      <div class="flow-actions"><button class="btn btn-coral btn-xl" data-act="tutup">${masuk ? 'Gas ke lapangan' : 'Sampai besok'}</button></div>`;
  } else if (f.step === 1) {
    let msg, aksi;
    if (f.loc) {
      msg = `<p class="flow-title">Lokasi terkunci</p><p class="coords">${f.loc.lat.toFixed(5)}, ${f.loc.lng.toFixed(5)}</p><p class="flow-sub">Akurasi ±${f.loc.acc} m${f.loc.demo ? ' · lokasi contoh' : ''}</p>`;
      aksi = '<button class="btn btn-coral btn-xl" data-act="flow-next">Lanjut ke selfie</button>';
    } else if (f.err) {
      msg = `<p class="flow-title">Lokasi belum kebaca</p><p class="flow-sub">${inTG ? 'Nyalakan GPS dan izinkan Telegram pakai lokasi, lalu coba lagi.' : 'Pratinjau ini nggak bisa baca GPS. Pas dibuka di Telegram, lokasinya asli.'}</p>`;
      aksi = inTG ? '<button class="btn btn-coral btn-xl" data-act="flow-retry">Coba lagi</button>'
        : '<button class="btn btn-coral btn-xl" data-act="flow-demo">Pakai lokasi contoh</button><button class="btn btn-ghost" data-act="flow-retry">Coba lagi</button>';
    } else {
      msg = '<p class="flow-title">Nyari lokasi kamu…</p><p class="flow-sub">Pastikan GPS nyala dan kamu ada di area kerja.</p>';
      aksi = '<button class="btn btn-xl" disabled>Mencari sinyal…</button>';
    }
    isi = `<div class="flow-body"><div class="radar ${f.loc ? 'dapat' : f.err ? 'gagal' : ''}"><span></span><span></span><span></span>${ICON.pin}</div>${msg}</div><div class="flow-actions">${aksi}</div>`;
  } else if (f.step === 2) {
    isi = `<div class="flow-body">
        <label for="pick-selfie" class="selfie ${f.foto ? 'ada' : ''}">${f.foto ? `<img src="${f.foto}" alt="Selfie kamu">` : `${ICON.camera}<span>Ketuk buat selfie</span>`}</label>
        <p class="flow-title">${f.foto ? 'Selfie siap' : 'Selfie dulu'}</p>
        <p class="flow-sub">Wajah kelihatan jelas, dengan latar tempat kamu ${masuk ? 'mulai' : 'selesai'} kerja.</p>
      </div>
      <div class="flow-actions">${f.foto
        ? `<button class="btn btn-coral btn-xl" data-act="flow-next">Lanjut</button><label for="pick-selfie" class="btn btn-ghost">${ICON.camera}Foto ulang</label>`
        : `<label for="pick-selfie" class="btn btn-coral btn-xl">${ICON.camera}Ambil selfie</label>`}</div>`;
  } else {
    const now = Date.now(), items = hadiahAbsen(f.type, now), mnt = minutesOf(now);
    const status = masuk ? (mnt <= SHIFT_MULAI ? 'Tepat waktu' : `Telat ${fmtDur(mnt - SHIFT_MULAI)}`)
      : (mnt >= SHIFT_SELESAI ? 'Full shift' : `${fmtDur(SHIFT_SELESAI - mnt)} lebih awal`);
    isi = `<div class="flow-body">
        <div class="card ringkas"><img src="${f.foto}" alt="Selfie kamu"><dl>
          <div><dt>Jam</dt><dd>${jam(now)}</dd></div>
          <div><dt>Lokasi</dt><dd>${f.loc.lat.toFixed(4)}, ${f.loc.lng.toFixed(4)}</dd></div>
          <div><dt>Status</dt><dd>${status}</dd></div>
        </dl></div>
        <ul class="hadiah">${items.map(([n, x]) => `<li><span>${n}</span><b>+${x}</b></li>`).join('')}<li class="total"><span>Total</span><b>+${total(items)} XP</b></li></ul>
      </div>
      <div class="flow-actions"><button class="btn btn-coral btn-xl" data-act="flow-kirim">${ICON.send}Kirim absen</button><button class="btn btn-ghost" data-act="flow-back">Ganti selfie</button></div>`;
  }
  const steps = f.done ? '' : `<div class="steps" aria-label="Langkah ${f.step} dari 3">${['Lokasi', 'Selfie', 'Kirim'].map((s, i) => `<div class="step ${i + 1 === f.step ? 'on' : ''} ${i + 1 < f.step ? 'lewat' : ''}"><i></i>${i + 1}. ${s}</div>`).join('')}</div>`;
  const sudahBuka = sheetMode === 'absen';
  const html = `<div class="sheet-panel full ${sudahBuka ? 'diam' : ''}"><div class="sheet-head"><h2 id="sheet-title" tabindex="-1">${judul}</h2><button class="icon-btn" data-act="tutup" aria-label="Tutup">${ICON.x}</button></div>${steps}${isi}</div>`;
  if (sudahBuka) $('#sheet').innerHTML = html; else bukaSheet('absen', html);
}
async function pilihSelfie(input) {
  const file = input.files && input.files[0]; input.value = '';
  if (!file || !flow) return;
  try { flow.foto = await kompres(file, 420); getar.ketuk(); } catch (e) { toast('Fotonya nggak kebaca. Coba ambil ulang.'); }
  renderFlow();
}
async function kirimAbsen(btn) {
  const f = flow; if (!f || f.sending) return;
  f.sending = true; btn.disabled = true; btn.textContent = 'Mengirim…'; getar.mantap();
  const t = Date.now(), xp = total(hadiahAbsen(f.type, t));
  const rec = { t, lat: f.loc.lat, lng: f.loc.lng, acc: f.loc.acc, demo: !!f.loc.demo, foto: f.foto, xp };
  try { await kirim('absen_' + f.type, rec); }
  catch (e) { f.sending = false; btn.disabled = false; btn.innerHTML = `${ICON.send}Kirim absen`; getar.awas(); toast(pesanGagal(e)); return; }
  if (flow !== f) return;
  S.absen[f.type] = rec;
  if (f.type === 'masuk') updateStreak();
  f.gain = grantXP(xp); f.done = { xp, t };
  renderFlow(); getar.sukses(); confetti();
}
function bukaRekap() {
  bukaSheet('rekap', `<div class="sheet-panel">
    <div class="sheet-head"><h2 id="sheet-title" tabindex="-1">Rekap buat atasan</h2><button class="icon-btn" data-act="tutup" aria-label="Tutup">${ICON.x}</button></div>
    <p class="flow-sub">Pesan ini yang nanti dikirim bot ke grup tim.</p>
    <div class="chat"><p class="chat-from">Bot Sales Quest</p><div class="bubble" id="rekap-teks">${esc(teksRekap())}</div><p class="chat-time">${jam(Date.now())}</p></div>
    <div class="flow-actions"><button class="btn btn-sun btn-xl" data-act="kirim-rekap">${ICON.send}Kirim lewat bot</button><button class="btn btn-ghost" data-act="salin">Salin teks</button></div>
  </div>`);
}
async function kirimRekap(btn) {
  if (!API_URL) { getar.awas(); toast('Bot belum tersambung. Salin teksnya dulu buat sementara.'); return; }
  const asli = btn.innerHTML; btn.disabled = true; btn.textContent = 'Mengirim…';
  try { await kirim('rekap', { teks: teksRekap() }); getar.sukses(); toast('Rekap terkirim ke grup'); tutupSheet(); }
  catch (e) { getar.awas(); toast(pesanGagal(e)); btn.disabled = false; btn.innerHTML = asli; }
}
function salinRekap() {
  const gagal = () => {
    const b = $('#rekap-teks');
    if (b) { const r = document.createRange(); r.selectNodeContents(b); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    toast('Teksnya udah diblok. Tekan lama buat salin.');
  };
  try { navigator.clipboard.writeText(teksRekap()).then(() => { getar.sukses(); toast('Teks rekap tersalin'); }, gagal); } catch (e) { gagal(); }
}
function bukaLevelUp(l) {
  getar.mantap(); confetti(1);
  bukaSheet('levelup', `<div class="sheet-panel levelup">
    <h2 id="sheet-title" class="lu-kicker" tabindex="-1">Naik level!</h2>
    <div class="shield"><span>${l}</span></div>
    <p class="lu-gelar">Gelar baru: ${gelar(l)}</p>
    <p class="flow-sub">Kumpulin ${need(l)} XP lagi buat ke level ${l + 1}.</p>
    <button class="btn btn-coral btn-xl" data-act="tutup">Lanjut</button>
  </div>`);
}

/* ================= NAVIGASI ================= */
let tabAktif = 'markas', resetSiap = false;
function perbaruiBadge() { $('#badge-markas').hidden = misiSiapKlaim().length === 0; }
function renderTab() { if (tabAktif === 'markas') renderMarkas(); else if (tabAktif === 'kunjungan') renderKunjungan(); else renderRiwayat(); }
function renderSemua() { renderHUD(); renderTab(); perbaruiBadge(); }
function setTab(name, diam) {
  if (tabAktif === 'kunjungan') ambilDraft();
  tabAktif = name;
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ['markas', 'kunjungan', 'riwayat'].forEach(v => { $('#v-' + v).hidden = v !== name; });
  renderTab(); $('#main').scrollTop = 0;
  if (!diam) getar.pilih();
}
function resetDemo(btn) {
  if (!resetSiap) {
    resetSiap = true; btn.textContent = 'Ketuk lagi buat hapus semua data demo';
    setTimeout(() => { resetSiap = false; if (btn.isConnected) btn.textContent = 'Reset data demo'; }, 3000);
    return;
  }
  resetSiap = false; S = stateBaru(); draft = { nama: '', hp: '', alamat: '', status: '', paket: '', catatan: '' }; fotoKunjungan = null;
  simpan(); renderSemua(); toast('Data demo direset');
}

function pasangEvent() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    switch (el.dataset.act) {
      case 'tab': setTab(el.dataset.tab); break;
      case 'absen': getar.ketuk(); bukaAbsen(el.dataset.type); break;
      case 'klaim': klaim(el.dataset.id, el); break;
      case 'tutup': tutupSheet(); break;
      case 'flow-next': getar.ketuk(); flow.step++; renderFlow(); break;
      case 'flow-back': getar.ketuk(); flow.step = 2; renderFlow(); break;
      case 'flow-retry': getar.ketuk(); cariLokasi(); break;
      case 'flow-demo': getar.ketuk(); flow.loc = Object.assign({}, LOKASI_CONTOH); flow.err = null; renderFlow(); break;
      case 'flow-kirim': kirimAbsen(el); break;
      case 'rekap': getar.ketuk(); bukaRekap(); break;
      case 'salin': salinRekap(); break;
      case 'kirim-rekap': kirimRekap(el); break;
      case 'reset': resetDemo(el); break;
    }
  });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' && sheetMode !== 'absen') tutupSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupSheet(); });
  document.addEventListener('submit', e => { if (e.target.id === 'f-kunjungan') { e.preventDefault(); simpanKunjungan(); } });
  document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#f-kunjungan')) ambilDraft(); });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'pick-selfie') return pilihSelfie(t);
    if (t.id === 'k-foto') {
      const file = t.files && t.files[0]; t.value = ''; if (!file) return;
      try {
        fotoKunjungan = await kompres(file, 360);
        const prev = $('#k-foto-prev'); if (prev) { prev.src = fotoKunjungan; prev.hidden = false; }
        const lbl = $('#k-foto-btn'); if (lbl) lbl.textContent = 'Ganti foto';
        getar.ketuk(); perbaruiRewardK();
      } catch (err) { toast('Fotonya nggak kebaca. Coba ambil ulang.'); }
      return;
    }
    if (t.name === 'status' || t.name === 'paket') {
      ambilDraft(); getar.pilih(); perbaruiRewardK();
      if (t.name === 'status') $('#k-status-err').hidden = true;
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.day !== todayKey()) { S = muat(S); simpan(); renderSemua(); }
  });
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(gambarKontur, 150); });
}

/* ================= MULAI ================= */
let S;
function mulai(data) {
  S = muat(data && data.S);
  tabAktif = (data && data.tab) || 'markas';
  siapkanTelegram();
  bangunHUD(); renderHUD();
  setTab(tabAktif, true); perbaruiBadge();
  gambarKontur(); pasangEvent();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(mulai); else mulai((hot && hot.data) || {});
if (hot && hot.snapshot) hot.snapshot(() => ({ S, tab: tabAktif }));
})();
</script>
</body>
</html>
